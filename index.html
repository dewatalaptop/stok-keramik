<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris GitHub</title>
    <style>
        /* CSS: Tampilan Visual */
        body {
            background: #202028;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            background-color: #000;
        }

        .ui-panel {
            display: flex;
            justify-content: space-between;
            width: 240px;
            margin-bottom: 10px;
        }

        .score-box {
            font-size: 1.2rem;
        }

        /* Kontrol untuk Mobile (Touchscreen) */
        #mobile-controls {
            display: none; /* Disembunyikan di Desktop */
            margin-top: 20px;
            gap: 10px;
        }

        .btn {
            background: #444;
            border: none;
            color: white;
            padding: 15px;
            border-radius: 50%;
            font-size: 1.2rem;
            width: 50px;
            height: 50px;
            touch-action: manipulation; /* Mencegah zoom saat tap cepat */
            cursor: pointer;
        }

        .btn:active {
            background: #666;
        }

        /* Tampilkan tombol hanya jika layar kecil */
        @media (max-width: 600px) {
            #mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div class="ui-panel">
        <div class="score-box">Skor: <span id="score">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
    </div>

    <div id="mobile-controls">
        <button class="btn" onclick="playerRotate(-1)">↻</button>
        <button class="btn" onclick="playerMove(-1)">←</button>
        <button class="btn" onclick="playerMove(1)">→</button>
        <button class="btn" onclick="playerDrop()">↓</button>
    </div>

    <script>
        // JAVASCRIPT: Logika Game
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');

        context.scale(20, 20); // Skala grid (setiap blok 20px)

        // Fungsi untuk membersihkan baris yang penuh
        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }

                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 10;
                rowCount *= 2;
            }
        }

        // Cek tabrakan
        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] &&
                        arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        // Membuat matriks grid kosong
        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        // Membuat bentuk potongan Tetris (Tetromino)
        function createPiece(type) {
            if (type === 'I') {
                return [
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 2, 0],
                    [0, 2, 0],
                    [0, 2, 2],
                ];
            } else if (type === 'J') {
                return [
                    [0, 3, 0],
                    [0, 3, 0],
                    [3, 3, 0],
                ];
            } else if (type === 'O') {
                return [
                    [4, 4],
                    [4, 4],
                ];
            } else if (type === 'Z') {
                return [
                    [5, 5, 0],
                    [0, 5, 5],
                    [0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 6, 6],
                    [6, 6, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'T') {
                return [
                    [0, 7, 0],
                    [7, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        // Menggambar elemen ke canvas
        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        // Menggambar matriks blok
        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x,
                                         y + offset.y,
                                         1, 1);
                        // Efek border blok agar terlihat terpisah
                        context.lineWidth = 0.05;
                        context.strokeStyle = 'white';
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        // Menyatukan potongan dengan arena saat mendarat
        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        // Fungsi rotasi matriks
        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [
                        matrix[x][y],
                        matrix[y][x],
                    ] = [
                        matrix[y][x],
                        matrix[x][y],
                    ];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        // Menjatuhkan potongan (Gravitasi)
        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        // Menggerakkan potongan kiri/kanan
        function playerMove(offset) {
            player.pos.x += offset;
            if (collide(arena, player)) {
                player.pos.x -= offset;
            }
        }

        // Mengatur ulang potongan (Spawn baru)
        function playerReset() {
            const pieces = 'TJLOSZI';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) -
                           (player.matrix[0].length / 2 | 0);
            
            // Game Over Check
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                player.score = 0;
                updateScore();
            }
        }

        // Fungsi rotasi player dengan pencegahan tabrakan tembok
        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;

        // Loop utama animasi game
        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
        }

        // Palet warna potongan
        const colors = [
            null,
            '#FF0D72', // T shape
            '#0DC2FF', // Cyan
            '#0DFF72', // Green
            '#F538FF', // Purple
            '#FF8E0D', // Orange
            '#FFE138', // Yellow
            '#3877FF', // Blue
        ];

        const arena = createMatrix(12, 20); // Lebar 12, Tinggi 20

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
        };

        // Kontrol Keyboard
        document.addEventListener('keydown', event => {
            if (event.keyCode === 37) { // Panah Kiri
                playerMove(-1);
            } else if (event.keyCode === 39) { // Panah Kanan
                playerMove(1);
            } else if (event.keyCode === 40) { // Panah Bawah
                playerDrop();
            } else if (event.keyCode === 81) { // Q (Rotasi kiri)
                playerRotate(-1);
            } else if (event.keyCode === 87 || event.keyCode === 38) { // W / Panah Atas (Rotasi kanan)
                playerRotate(1);
            }
        });

        // Inisialisasi Game
        playerReset();
        updateScore();
        update();
    </script>
</body>
</html>
