<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flappy Dolan Sawah - Voucher Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        /* 1. LAYOUT & RESET */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            margin: 0; padding: 0;
            height: 100dvh; /* Dynamic Height untuk Mobile Browser */
            width: 100vw;
            background-color: #333;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden; 
            touch-action: none; 
            user-select: none;
            display: flex; justify-content: center; align-items: center;
        }

        /* 2. GAME CONTAINER (LANGIT CSS) */
        #game-stage {
            position: relative;
            width: 100%; max-width: 480px;
            height: 100%; 
            /* Optimasi: Langit pakai CSS Gradient agar ringan */
            background: linear-gradient(to bottom, #70C5CE 0%, #a4e4ea 100%);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        canvas { 
            display: block; 
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* 3. UI LAYERS */
        .ui-layer { 
            position: absolute; width: 100%; pointer-events: none; 
            z-index: 10; text-align: center; 
        }
        
        #score-display {
            top: 10%; font-size: 4rem; color: white;
            -webkit-text-stroke: 2px #000;
            text-shadow: 4px 4px 0 #000;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px); /* Efek Blur Kekinian */
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            z-index: 20; display: none;
        }

        /* 4. BUTTON STYLING */
        .btn {
            background: #E86101; border: 2px solid #fff;
            box-shadow: 0 4px 0 #994000; color: white;
            padding: 15px 25px; font-size: 1rem;
            font-family: inherit; cursor: pointer;
            border-radius: 8px; margin: 10px;
            text-transform: uppercase; width: 80%;
            pointer-events: auto; transition: transform 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #994000; }
        .btn-green { background: #73BF2E; box-shadow: 0 4px 0 #4c8519; }

        /* 5. VOUCHER DESIGN */
        .voucher-card {
            background: #fffcf5; 
            border: 4px dashed #E86101;
            padding: 20px; width: 90%; max-width: 350px;
            border-radius: 15px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="game-stage">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-layer" id="score-display">0</div>

        <div id="start-screen" class="screen" style="display: flex;">
            <h1 style="color: #F4D03F; -webkit-text-stroke: 2px #000; text-shadow: 4px 4px 0 #000; font-size: 2.5rem; text-align: center; line-height: 1.5; margin-bottom: 20px;">
                DOLAN<br>SAWAH
            </h1>
            <div style="color:white; font-size:0.7rem; margin-bottom:20px;">Dapatkan Skor <span style="color:#F4D03F; font-weight:bold;">20</span><br>untuk Es Teh Gratis!</div>
            <button class="btn" onclick="game.start()">MAIN SEKARANG</button>
        </div>

        <div id="game-over-screen" class="screen">
            <h2 style="color:white; -webkit-text-stroke: 1px #000; font-size:2rem; margin-bottom:10px;">GAME OVER</h2>
            <div style="background: #DED895; border: 3px solid #543847; padding: 15px; border-radius: 10px; width: 80%; text-align: center; margin-bottom: 15px;">
                <div style="font-size:0.8rem; color:#543847;">SKOR KAMU</div>
                <div id="final-score" style="font-size: 2.5rem; color:#E86101; margin: 5px 0;">0</div>
                <div style="font-size:0.6rem; color:#555; border-top:1px dashed #543847; padding-top:5px; margin-top:5px;">
                    Butuh skor 20 untuk Voucher
                </div>
            </div>
            <button class="btn" onclick="game.start()">COBA LAGI</button>
        </div>

        <div id="voucher-screen" class="screen" style="background: rgba(0,0,0,0.85);">
            <div class="voucher-card">
                <h2 style="color: #E86101; margin: 0 0 10px 0; font-size: 1.2rem;">🎉 SELAMAT! 🎉</h2>
                <p style="font-size: 0.6rem; color:#555; margin-bottom: 5px;">Kamu menaklukan sawah!</p>
                
                <div style="background: #eee; padding: 8px; border-radius: 6px; margin: 10px 0; font-size: 0.8rem;">
                    Skor Akhir: <span id="voucher-score-val" style="font-weight: bold; color: #E86101;">0</span>
                </div>

                <div style="margin: 15px 0;">
                    <div style="font-size: 0.6rem; color: #555;">Tunjukkan Kasir & Dapat:</div>
                    <h1 style="font-size: 1.5rem; color: #73BF2E; margin: 5px 0; -webkit-text-stroke: 1px #000;">GRATIS<br>ES TEH</h1>
                </div>

                <div style="border-top: 2px dashed #ccc; padding-top: 10px; margin-top: 10px;">
                    <div style="font-size: 0.5rem; color: #888;">KODE VALIDASI:</div>
                    <div id="voucher-code" style="font-family: monospace; font-size: 1rem; font-weight: bold; letter-spacing: 2px; color:#333; margin: 5px 0;">LOADING...</div>
                    
                    <div style="margin-top: 8px; background: #ffeba7; padding: 6px; border-radius: 4px; color: #543847; border: 1px solid #e0c870;">
                        <div style="font-size: 0.5rem;">Jam Server (Wajib Bergerak):</div>
                        <div id="live-clock" style="font-weight: bold; font-size: 1rem; margin-top:2px;">00:00:00</div>
                    </div>
                </div>

                <button class="btn btn-green" style="margin-top: 15px; font-size: 0.8rem; padding: 12px; width: 100%;" onclick="location.reload()">KEMBALI KE MENU</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. KONFIGURASI (Bisa Diedit)
        // ==========================================
        const CONFIG = {
            gravity: 0.35,  // Berat burung (makin besar makin cepat jatuh)
            jump: 6.5,      // Kekuatan lompat
            speed: 3,       // Kecepatan gerak sawah
            gap: 125,       // Jarak antar pipa (makin besar makin mudah)
            voucherTarget: 20 // SKOR MINIMAL UNTUK DAPAT VOUCHER
        };

        // ==========================================
        // 2. OPTIMIZED ENGINE & ASSETS
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: true }); // Alpha true untuk overlay di atas background CSS

        // PRE-RENDER ASSETS (Teknik Anti-Lag)
        // Kita menggambar aset ke memori sekali saja, lalu copy-paste saat game jalan.
        const assets = {
            bird: document.createElement('canvas'),
            pipeTop: document.createElement('canvas'),
            pipeBot: document.createElement('canvas')
        };

        function initAssets() {
            // A. GAMBAR BURUNG (Kuning - Ekor Oranye)
            assets.bird.width = 38; assets.bird.height = 30;
            const b = assets.bird.getContext('2d');
            // Badan
            b.beginPath(); b.ellipse(19,15,17,13,0,0,Math.PI*2);
            b.fillStyle="#FFD700"; b.fill(); b.lineWidth=2; b.stroke();
            // Mata
            b.beginPath(); b.arc(26,10,5,0,Math.PI*2); b.fillStyle="#FFF"; b.fill(); b.stroke();
            b.beginPath(); b.arc(28,10,2,0,Math.PI*2); b.fillStyle="#000"; b.fill();
            // Sayap
            b.beginPath(); b.ellipse(12,18,8,5,0,0,Math.PI*2); b.fillStyle="#FFF"; b.fill(); b.stroke();
            // Paruh
            b.beginPath(); b.moveTo(28,18); b.lineTo(38,22); b.lineTo(28,26); b.fillStyle="#E86101"; b.fill(); b.stroke();

            // B. GAMBAR PIPA (Tema Sawah Hijau)
            const w = 56, h = 600; // Tinggi pipa dimaximalkan
            assets.pipeTop.width = w; assets.pipeTop.height = h;
            assets.pipeBot.width = w; assets.pipeBot.height = h;
            
            const pt = assets.pipeTop.getContext('2d');
            const pb = assets.pipeBot.getContext('2d');

            // Style Pipa Hijau
            [pt, pb].forEach(c => {
                c.fillStyle="#73BF2E"; c.fillRect(2,0,w-4,h);
                c.strokeStyle="#000"; c.lineWidth=2; c.strokeRect(2,0,w-4,h);
                // Highlight
                c.fillStyle="#8CD645"; c.fillRect(6,0,6,h); 
                c.fillStyle="#558F22"; c.fillRect(w-10,0,4,h); 
            });

            // Kepala Pipa (Top) - Di bawah
            pt.fillStyle="#73BF2E"; pt.fillRect(0,h-30,w,30); pt.strokeRect(0,h-30,w,30);
            
            // Kepala Pipa (Bot) - Di atas
            pb.fillStyle="#73BF2E"; pb.fillRect(0,0,w,30); pb.strokeRect(0,0,w,30);
        }

        // ==========================================
        // 3. GAME LOGIC
        // ==========================================
        const game = {
            running: false, score: 0, frames: 0,
            bird: { y: 0, v: 0 },
            pipes: [],
            
            start: function() {
                // Resize Canvas agar tajam di HP
                const container = document.getElementById('game-stage');
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;

                this.bird.y = canvas.height / 2;
                this.bird.v = 0;
                this.pipes = [];
                this.score = 0;
                this.frames = 0;
                this.running = true;

                document.getElementById('score-display').innerText = 0;
                document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
                
                initAssets();
                requestAnimationFrame(loop);
            },

            over: function() {
                this.running = false;
                
                // Cek apakah dapat voucher?
                if(this.score >= CONFIG.voucherTarget) {
                    showVoucher(this.score);
                } else {
                    document.getElementById('final-score').innerText = this.score;
                    document.getElementById('game-over-screen').style.display = 'flex';
                }
            }
        };

        function loop() {
            if(!game.running) return;

            // 1. Bersihkan Canvas (Transparan, Background pakai CSS)
            ctx.clearRect(0,0,canvas.width,canvas.height);

            // 2. Physics Burung
            game.bird.v += CONFIG.gravity;
            game.bird.y += game.bird.v;

            // 3. Logic Pipa
            game.frames++;
            if(game.frames % 100 === 0) { // Spawn rate
                let min = 80;
                let max = canvas.height - 112 - CONFIG.gap - 80;
                // Safety check
                if(max < min) max = min + 20; 

                let h = Math.floor(Math.random() * (max - min + 1) + min);
                game.pipes.push({ x: canvas.width, topH: h, passed: false });
            }

            // 4. Draw & Collision
            const birdX = 60;
            const birdSize = 14; // Radius hitbox (agak kecil biar forgiving)
            
            // Draw Ground (Lantai)
            const groundY = canvas.height - 50;

            for(let i = 0; i < game.pipes.length; i++) {
                let p = game.pipes[i];
                p.x -= CONFIG.speed;

                // Draw Pipa Atas (Ambil bagian bawah gambar aset)
                ctx.drawImage(assets.pipeTop, p.x, p.topH - 600); 
                // Draw Pipa Bawah
                ctx.drawImage(assets.pipeBot, p.x, p.topH + CONFIG.gap);

                // Collision Logic (Sederhana & Efisien)
                if ( birdX + birdSize > p.x && birdX - birdSize < p.x + 52 ) {
                    if ( game.bird.y - birdSize < p.topH || game.bird.y + birdSize > p.topH + CONFIG.gap ) {
                        game.over();
                    }
                }

                // Score Logic
                if(p.x + 52 < birdX && !p.passed) {
                    game.score++;
                    document.getElementById('score-display').innerText = game.score;
                    p.passed = true;
                }

                // Cleanup Pipa
                if(p.x < -60) { game.pipes.shift(); i--; }
            }

            // Draw Burung (Dengan Rotasi)
            ctx.save();
            ctx.translate(birdX, game.bird.y);
            let rot = Math.min(Math.PI/4, Math.max(-Math.PI/4, game.bird.v * 0.1));
            ctx.rotate(rot);
            ctx.drawImage(assets.bird, -19, -15);
            ctx.restore();

            // Draw Ground Moving
            let offset = (game.frames * CONFIG.speed) % 20;
            ctx.fillStyle = "#DED895";
            ctx.fillRect(0, groundY, canvas.width, 50);
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); 
            ctx.strokeStyle="#543847"; ctx.lineWidth=3; ctx.stroke();
            
            // Rumput Parallax
            ctx.fillStyle="#73BF2E"; ctx.fillRect(0,groundY,canvas.width,10);
            ctx.fillStyle="#558F22";
            for(let k = -offset; k < canvas.width; k+=20) {
                ctx.fillRect(k, groundY, 10, 10);
            }

            // Cek Mati Jatuh / Terbang Ke Langit
            if(game.bird.y >= groundY - 10 || game.bird.y < 0) game.over();

            requestAnimationFrame(loop);
        }

        // ==========================================
        // 4. INPUT HANDLING (RESPONSIF)
        // ==========================================
        function flap(e) {
            // Mencegah zoom double tap & scroll
            if(e.type !== 'keydown') { 
               if(e.cancelable) e.preventDefault(); 
            }
            
            if(game.running) {
                game.bird.v = -CONFIG.jump;
            } else {
                // Jika di start screen, tap langsung mulai
                const startSc = document.getElementById('start-screen');
                if(startSc.style.display !== 'none') game.start();
            }
        }
        
        // Listener Passive: False (Wajib untuk Chrome Mobile baru agar tidak lag)
        window.addEventListener('touchstart', flap, {passive: false});
        window.addEventListener('mousedown', flap);
        window.addEventListener('keydown', (e) => { 
            if(e.code === 'Space') flap(e); 
        });

        // ==========================================
        // 5. VOUCHER SYSTEM
        // ==========================================
        function showVoucher(score) {
            const vScreen = document.getElementById('voucher-screen');
            vScreen.style.display = 'flex';
            document.getElementById('voucher-score-val').innerText = score;
            
            // Generator Kode Unik (DS + Tanggal + Huruf Acak)
            const d = new Date();
            const dateStr = `${d.getDate()}${d.getMonth()+1}`;
            const rand = Math.random().toString(36).substring(2,6).toUpperCase();
            document.getElementById('voucher-code').innerText = `DS-${dateStr}-${rand}`;

            // Jam Digital (Anti Screenshot)
            if(window.clockInterval) clearInterval(window.clockInterval);
            
            window.clockInterval = setInterval(() => {
                const now = new Date();
                // Format HH:MM:SS
                const timeStr = now.toLocaleTimeString('id-ID', { hour12: false });
                document.getElementById('live-clock').innerText = timeStr;
            }, 1000);
        }

        // Init Assets pertama kali
        initAssets();
    </script>
</body>
</html>
