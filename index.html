<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Ultimate v2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --primary: #E86101;
            --secondary: #70C5CE;
            --bg-ui: #DED895;
            --border: #543847;
        }

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            background-color: #222;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            touch-action: none;
            user-select: none; -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            width: 100%; max-width: 420px;
            height: 100%; max-height: 800px;
            background: var(--secondary);
            overflow: hidden;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* UI ELEMENTS */
        #flash-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: white; opacity: 0; pointer-events: none; z-index: 50;
            transition: opacity 0.1s ease-out;
        }

        #ui-layer {
            position: absolute; top: 10%; width: 100%;
            text-align: center; pointer-events: none; z-index: 20;
        }

        #score {
            font-size: 3.5rem; color: white;
            -webkit-text-stroke: 2px #000;
            text-shadow: 3px 3px 0 #000;
            transition: transform 0.1s;
        }

        .screen {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%; z-index: 30;
            display: none;
            flex-direction: column; align-items: center;
        }

        .btn {
            background: var(--primary); border: 2px solid #fff;
            box-shadow: 0 4px 0 #994000; color: white;
            padding: 14px 10px; font-size: 0.9rem;
            font-family: inherit; cursor: pointer;
            border-radius: 8px; margin-top: 12px;
            text-transform: uppercase; width: 100%;
            position: relative; top: 0; transition: top 0.1s, box-shadow 0.1s;
        }
        .btn:active { top: 4px; box-shadow: 0 0 0 #994000; }
        .btn-google { background: #4285F4; box-shadow: 0 4px 0 #0d47a1; }
        .btn-google:active { box-shadow: 0 0 0 #0d47a1; }
        
        .btn-row { display: flex; gap: 8px; width: 100%; margin-top: 10px; }
        .btn-small { font-size: 0.6rem; padding: 10px; margin: 0; flex: 1; }
        .btn-active { background: #73BF2E; box-shadow: 0 4px 0 #4c8519; }
        .btn-active:active { box-shadow: 0 0 0 #4c8519; }

        h1 {
            color: #F4D03F; -webkit-text-stroke: 1.5px #000;
            text-shadow: 4px 4px 0 #000; font-size: 2rem; margin: 0 0 20px 0;
            text-align: center; line-height: 1.2;
        }

        /* LEADERBOARD STYLES */
        .board-container {
            background: var(--bg-ui); border: 3px solid var(--border);
            border-radius: 8px; width: 100%; box-sizing: border-box;
            padding: 10px; margin-bottom: 10px;
        }

        .rank-list {
            max-height: 160px; overflow-y: auto;
            margin-top: 5px;
            scrollbar-width: thin;
        }
        .rank-list::-webkit-scrollbar { width: 4px; }
        .rank-list::-webkit-scrollbar-thumb { background: var(--border); }

        .rank-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 4px; border-bottom: 1px dashed rgba(84, 56, 71, 0.3);
            font-size: 0.65rem; color: var(--border);
        }
        .rank-row:last-child { border-bottom: none; }
        .rank-me { color: #E86101; font-weight: bold; background: rgba(232, 97, 1, 0.1); }
        
        /* USER INFO */
        #user-top-bar {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 25;
        }
        .info-pill {
            background: rgba(0,0,0,0.6); color: white;
            padding: 4px 8px; border-radius: 20px;
            font-size: 0.5rem; display: flex; align-items: center; gap: 6px;
            pointer-events: auto; border: 1px solid rgba(255,255,255,0.3);
        }
        #user-photo { width: 20px; height: 20px; border-radius: 50%; border: 1px solid white; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="flash-overlay"></div>

        <div id="user-top-bar">
            <div id="user-info" class="info-pill" style="display:none;">
                <img id="user-photo" src="" alt="u">
                <span id="user-name">Player</span>
                <button id="btn-logout" style="background:transparent; border:none; color:#FF6B6B; font-weight:bold; cursor:pointer; font-size:0.8rem;">×</button>
            </div>
            <div id="location-badge" class="info-pill" style="display:none;">📍 ...</div>
        </div>

        <div id="ui-layer">
            <div id="score">0</div>
        </div>

        <div id="login-screen" class="screen" style="display: flex;">
            <h1>FLAPPY<br>ULTIMATE</h1>
            <p style="color:white; font-size:0.6rem; text-align:center; margin-bottom:20px; line-height:1.6; text-shadow:1px 1px 0 #000;">
                RANKING GLOBAL & LOKAL<br>BERBASIS LOKASI
            </p>
            <button id="btn-login" class="btn btn-google">LOGIN GOOGLE</button>
            <button id="btn-offline" class="btn">MAIN OFFLINE</button>
        </div>

        <div id="start-screen" class="screen">
            <h1>GET<br>READY</h1>
            <div style="font-size: 0.6rem; color: #fff; margin-bottom: 15px; text-shadow:1px 1px 0 #000;">
                TAP TO FLAP
            </div>
            <img src="https://img.icons8.com/ios-filled/50/ffffff/hand-cursor.png" style="width:30px; opacity:0.8; animation: bounce 1s infinite;">
            <style>@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }</style>
        </div>

        <div id="game-over-screen" class="screen">
            <h1 style="font-size:1.8rem; margin-bottom:10px;">GAME OVER</h1>
            
            <div class="board-container">
                <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:5px;">
                    <span style="font-size:0.6rem; color:#543847;">SCORE</span>
                    <span style="font-size:0.6rem; color:#543847;">BEST</span>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span id="final-score" style="font-size: 1.5rem; color:var(--primary);">0</span>
                    <span id="best-score" style="font-size: 1.5rem; color:#543847;">0</span>
                </div>
            </div>

            <div class="btn-row">
                <button id="btn-tab-world" class="btn btn-small btn-active">WORLD 🌍</button>
                <button id="btn-tab-city" class="btn btn-small">CITY 🏘️</button>
            </div>

            <div class="board-container" style="padding:5px; margin-top:5px; background: rgba(255,255,255,0.8);">
                <div id="leaderboard-list" class="rank-list">Loading...</div>
            </div>

            <div class="btn-row">
                <button id="btn-share" class="btn btn-small" style="background:#25D366; box-shadow:0 4px 0 #128C7E;">SHARE WA</button>
                <button id="btn-retry" class="btn btn-small">RETRY ▶</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, query, orderBy, limit, getDocs, where } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDH6cBMyBCNdzG_tdJNs28AZZIm8HnO8l4",
            authDomain: "flytap-ca3ee.firebaseapp.com",
            projectId: "flytap-ca3ee",
            storageBucket: "flytap-ca3ee.firebasestorage.app",
            messagingSenderId: "690738199480",
            appId: "1:690738199480:web:b1b442690440db79016d4d"
        };

        // VARIABLES
        let app, auth, db, provider;
        let currentUser = null;
        let userLocation = { city: "Unknown", country: "Unknown" };
        let currentTab = 'world';
        let highScore = 0;

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            provider = new GoogleAuthProvider();
        } catch(e) { console.error("Firebase init failed", e); }

        // GAME ENGINE
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const flashOverlay = document.getElementById('flash-overlay');
        
        let frames = 0;
        let gameState = 'START'; // START, PLAYING, DYING, GAMEOVER
        let gameScore = 0;
        let scale = 1; // Logic scaler

        const CONSTANTS = {
            gravity: 0.25,
            jump: 5,
            speed: 2,
            gap: 130, // Lebih lebar biar mudah sedikit
            spawnRate: 140
        };

        // Responsive Canvas
        function resize() {
            const container = canvas.parentElement;
            const dpr = window.devicePixelRatio || 1;
            // Set ukuran display CSS
            canvas.style.width = container.clientWidth + 'px';
            canvas.style.height = container.clientHeight + 'px';
            // Set ukuran buffer memori (dikalikan DPR agar tajam)
            canvas.width = container.clientWidth * dpr;
            canvas.height = container.clientHeight * dpr;
            // Normalize coordinate system
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0); 
            
            // Logic scale base: width 360 reference
            scale = container.clientWidth / 360; 
            ground.y = container.clientHeight - 100;
        }
        window.addEventListener('resize', resize);
        
        // --- ENTITIES ---
        const bird = {
            x: 50, y: 150, r: 12, v: 0, rot: 0,
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                let rotTarget = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.v * 0.1)));
                if(gameState === 'DYING') rotTarget = Math.PI/2; // Jatuh tegak lurus
                this.rot += (rotTarget - this.rot) * 0.1;
                ctx.rotate(this.rot);
                
                // Bird Art
                ctx.beginPath(); ctx.ellipse(0, 0, this.r*1.2, this.r, 0, 0, Math.PI*2); 
                ctx.fillStyle = "#FFD700"; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle="#000"; ctx.stroke();
                // Eye
                ctx.beginPath(); ctx.arc(6, -4, 5, 0, Math.PI*2); ctx.fillStyle="#FFF"; ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(8, -4, 2, 0, Math.PI*2); ctx.fillStyle="#000"; ctx.fill();
                // Wing
                ctx.beginPath(); ctx.ellipse(-4, 4, 7, 4, -0.2, 0, Math.PI*2); ctx.fillStyle="#FFF"; ctx.fill(); ctx.stroke();
                // Beak
                ctx.beginPath(); ctx.moveTo(8, 2); ctx.lineTo(16, 6); ctx.lineTo(8, 10); ctx.fillStyle="#E86101"; ctx.fill(); ctx.stroke();
                
                ctx.restore();
            },
            update() {
                this.v += CONSTANTS.gravity * scale;
                this.y += this.v;

                // Ground Collision
                if (this.y + this.r >= ground.y) {
                    this.y = ground.y - this.r;
                    finishGame();
                }
            },
            flap() {
                if (this.y > 0) this.v = -CONSTANTS.jump * scale;
            }
        };

        const pipes = {
            items: [], w: 50,
            reset() { this.items = []; },
            update() {
                if (frames % CONSTANTS.spawnRate === 0) {
                    const min = 50 * scale;
                    const max = ground.y - CONSTANTS.gap * scale - 50 * scale;
                    const y = Math.floor(Math.random() * (max - min + 1) + min);
                    this.items.push({ x: canvas.width / (window.devicePixelRatio||1), y: y, passed: false });
                }

                for (let i = 0; i < this.items.length; i++) {
                    let p = this.items[i];
                    p.x -= CONSTANTS.speed * scale;

                    // Collision Logic (Sedikit pemaaf -2px)
                    const hitbox = 4; 
                    if (
                        bird.x + bird.r - hitbox > p.x && 
                        bird.x - bird.r + hitbox < p.x + this.w
                    ) {
                        if (bird.y - bird.r + hitbox < p.y || bird.y + bird.r - hitbox > p.y + CONSTANTS.gap * scale) {
                            hitPipe();
                        }
                    }

                    // Score
                    if (p.x + this.w < bird.x && !p.passed) {
                        gameScore++;
                        document.getElementById('score').innerText = gameScore;
                        p.passed = true;
                    }

                    // Remove
                    if (p.x + this.w < -50) {
                        this.items.shift();
                        i--;
                    }
                }
            },
            draw() {
                ctx.fillStyle = "#73BF2E"; ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
                for (let p of this.items) {
                    // Top Pipe
                    ctx.fillRect(p.x, 0, this.w, p.y); 
                    ctx.strokeRect(p.x, -2, this.w, p.y+2);
                    ctx.fillRect(p.x-2, p.y-20, this.w+4, 20); ctx.strokeRect(p.x-2, p.y-20, this.w+4, 20);
                    
                    // Bottom Pipe
                    let botY = p.y + CONSTANTS.gap * scale;
                    let botH = ground.y - botY;
                    ctx.fillRect(p.x, botY, this.w, botH); 
                    ctx.strokeRect(p.x, botY, this.w, botH); // Fixed overlap
                    ctx.fillRect(p.x-2, botY, this.w+4, 20); ctx.strokeRect(p.x-2, botY, this.w+4, 20);
                }
            }
        };

        const ground = {
            y: 0, x: 0,
            draw() {
                ctx.fillStyle = "#DED895";
                ctx.fillRect(0, this.y, canvas.width, canvas.height - this.y);
                // Grass
                ctx.fillStyle = "#73BF2E"; ctx.fillRect(0, this.y, canvas.width, 15);
                ctx.beginPath(); ctx.moveTo(0, this.y); ctx.lineTo(canvas.width, this.y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, this.y+15); ctx.lineTo(canvas.width, this.y+15); ctx.stroke();
                
                // Stripes
                ctx.save(); ctx.beginPath();
                ctx.rect(0, this.y+1, canvas.width, 14); ctx.clip();
                ctx.strokeStyle = "#558C22"; ctx.lineWidth = 2;
                for(let i=0; i<canvas.width/10 + 5; i++) {
                    let ox = (this.x % 20) + (i*20) - 20;
                    ctx.moveTo(ox, this.y); ctx.lineTo(ox+10, this.y+15);
                }
                ctx.stroke(); ctx.restore();
            },
            update() {
                this.x -= CONSTANTS.speed * scale;
            }
        };

        // --- GAME LOOP ---
        function loop() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            
            // Draw Background (Simple Gradient)
            const grad = ctx.createLinearGradient(0,0,0,canvas.height);
            grad.addColorStop(0, "#70C5CE"); grad.addColorStop(1, "#A0E0E0");
            ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width, canvas.height);

            if (gameState === 'PLAYING') {
                pipes.update();
                ground.update();
            }
            pipes.draw();
            ground.draw();

            if (gameState === 'PLAYING' || gameState === 'DYING') {
                bird.update();
                bird.draw();
                frames++;
            } else if (gameState === 'START') {
                bird.y = canvas.height/2.5 + Math.sin(Date.now()/300)*5; // Hover
                bird.draw();
                ground.update(); // Ground moves in menu
            }

            requestAnimationFrame(loop);
        }

        function hitPipe() {
            if (gameState !== 'PLAYING') return;
            gameState = 'DYING'; // Bird falls, pipes stop
            bird.v = 0; // Stop upward momentum, start falling
            
            // Flash Effect
            flashOverlay.style.opacity = '0.8';
            setTimeout(() => flashOverlay.style.opacity = '0', 100);
        }

        function finishGame() {
            if (gameState === 'GAMEOVER') return;
            gameState = 'GAMEOVER';
            
            // Update UI
            document.getElementById('score').style.display = 'none';
            document.getElementById('final-score').innerText = gameScore;
            
            if (gameScore > highScore) highScore = gameScore;
            document.getElementById('best-score').innerText = highScore;

            document.getElementById('game-over-screen').style.display = 'flex';
            
            saveScore();
            switchTab('world');
        }

        function startGame() {
            gameState = 'PLAYING';
            bird.y = canvas.height / 2.5;
            bird.v = 0; bird.rot = 0;
            gameScore = 0; frames = 0;
            pipes.reset();
            
            document.getElementById('score').innerText = '0';
            document.getElementById('score').style.display = 'block';
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
        }

        // INPUT
        function inputAction(e) {
            if (e.type === 'keydown' && e.code !== 'Space') return;
            if (e.type !== 'keydown') e.preventDefault(); // Prevent scroll/zoom

            if (gameState === 'START') {
                document.getElementById('start-screen').style.display = 'none';
                startGame();
            } else if (gameState === 'PLAYING') {
                bird.flap();
            }
        }
        window.addEventListener('keydown', inputAction);
        canvas.addEventListener('touchstart', inputAction, {passive: false});
        canvas.addEventListener('mousedown', inputAction);

        // --- FIREBASE LOGIC ---
        
        async function detectLocation() {
            try {
                const r = await fetch('https://ipapi.co/json/');
                const d = await r.json();
                if (d.city) {
                    userLocation = { city: d.city, country: d.country_name };
                    const badge = document.getElementById('location-badge');
                    badge.style.display = 'flex';
                    badge.innerText = `📍 ${d.city}`;
                }
            } catch(e) {}
        }
        detectLocation();

        if (auth) {
            onAuthStateChanged(auth, u => {
                currentUser = u;
                if(u) {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('start-screen').style.display = 'flex';
                    document.getElementById('user-info').style.display = 'flex';
                    document.getElementById('user-name').innerText = u.displayName.split(' ')[0];
                    document.getElementById('user-photo').src = u.photoURL;
                    loadHighScore();
                } else {
                    document.getElementById('login-screen').style.display = 'flex';
                }
            });
        }

        async function loadHighScore() {
            if(!currentUser || !db) return;
            const docSnap = await getDoc(doc(db, "scores", currentUser.uid));
            if(docSnap.exists()) highScore = docSnap.data().score || 0;
        }

        async function saveScore() {
            if(!currentUser || !db) return;
            const ref = doc(db, "scores", currentUser.uid);
            // Hanya save jika score > best
            if(gameScore > highScore) {
                 await setDoc(ref, {
                    name: currentUser.displayName,
                    photo: currentUser.photoURL,
                    score: gameScore,
                    city: userLocation.city,
                    country: userLocation.country,
                    timestamp: Date.now()
                }, { merge: true });
            }
        }

        window.switchTab = async function(t) {
            currentTab = t;
            const btnW = document.getElementById('btn-tab-world');
            const btnC = document.getElementById('btn-tab-city');
            const list = document.getElementById('leaderboard-list');
            
            btnW.className = t==='world' ? 'btn btn-small btn-active' : 'btn btn-small';
            btnC.className = t==='city' ? 'btn btn-small btn-active' : 'btn btn-small';
            
            list.innerHTML = 'Loading...';

            if(!db) { list.innerHTML = "Offline Mode"; return; }

            try {
                let q;
                const ref = collection(db, "scores");
                
                if (t === 'world') {
                    q = query(ref, orderBy("score", "desc"), limit(20));
                } else {
                    // Cek jika city valid
                    if(userLocation.city === 'Unknown') {
                        list.innerHTML = "Locating city...";
                        return;
                    }
                    // NOTICE: INI BUTUH COMPOSITE INDEX DI FIREBASE CONSOLE
                    // Collection: scores, Fields: city Ascending, score Descending
                    q = query(ref, where("city", "==", userLocation.city), orderBy("score", "desc"), limit(20));
                }

                const snap = await getDocs(q);
                if(snap.empty) { list.innerHTML = "No records yet."; return; }
                
                let html = ""; let i = 1;
                snap.forEach(d => {
                    const val = d.data();
                    const isMe = currentUser && d.id === currentUser.uid;
                    html += `
                    <div class="rank-row ${isMe?'rank-me':''}">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <b style="width:20px;">#${i}</b>
                            <span>${val.name.substring(0,12)}</span>
                        </div>
                        <b>${val.score}</b>
                    </div>`;
                    i++;
                });
                list.innerHTML = html;

            } catch(e) {
                console.log(e);
                if(e.message.includes('index')) {
                    list.innerHTML = "<span style='color:red;font-size:0.5rem'>Admin: Create Index in Console!<br>city (asc) + score (desc)</span>";
                } else {
                    list.innerHTML = "Error loading data.";
                }
            }
        }

        // UI Events
        document.getElementById('btn-login').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('btn-logout').onclick = () => signOut(auth);
        document.getElementById('btn-offline').onclick = () => {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
        };
        document.getElementById('btn-retry').onclick = (e) => {
            e.stopPropagation(); // Biar gak langsung lompat
            startGame();
        }
        document.getElementById('btn-tab-world').onclick = (e) => { e.stopPropagation(); switchTab('world'); }
        document.getElementById('btn-tab-city').onclick = (e) => { e.stopPropagation(); switchTab('city'); }
        document.getElementById('btn-share').onclick = (e) => {
             e.stopPropagation();
             const txt = `Aku dapet skor ${gameScore} di Flappy Ultimate! 📍 ${userLocation.city}`;
             window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`);
        }

        // Init
        resize();
        loop();

    </script>
</body>
</html>
