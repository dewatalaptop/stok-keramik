<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Ultimate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            background-color: #222;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            touch-action: none; 
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            width: 100%; max-width: 400px; 
            height: 100%; max-height: 600px;
            /* Background warna diatur via JS sekarang */
            background: #70C5CE; 
            overflow: hidden;
        }

        canvas { display: block; width: 100%; height: 100%; }

        #ui-layer {
            position: absolute; top: 10%; width: 100%;
            text-align: center; pointer-events: none; z-index: 20;
        }

        #score {
            font-size: 3rem; color: white;
            -webkit-text-stroke: 2px #000;
            text-shadow: 2px 2px 0 #000;
        }

        .screen {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; width: 90%; z-index: 30;
            display: none;
        }

        .btn {
            background: #E86101; border: 2px solid #fff;
            box-shadow: 0 4px 0 #994000; color: white;
            padding: 12px 10px; font-size: 0.8rem;
            font-family: inherit; cursor: pointer;
            border-radius: 5px; margin-top: 10px;
            text-transform: uppercase; width: 100%;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #994000; }
        .btn-google { background: #4285F4; box-shadow: 0 4px 0 #0d47a1; }
        .btn-share { background: #25D366; box-shadow: 0 4px 0 #128C7E; } /* Warna WA */
        .btn-small { width: auto; display: inline-block; font-size: 0.6rem; padding: 8px; margin: 5px 2px; }
        .btn-active { background: #73BF2E; box-shadow: 0 4px 0 #4c8519; }

        h1 { 
            color: #F4D03F; -webkit-text-stroke: 1.5px #000;
            text-shadow: 3px 3px 0 #000; font-size: 1.5rem; margin-bottom: 20px;
        }
        
        .leaderboard-box {
            background: #DED895; border: 2px solid #543847;
            padding: 10px; border-radius: 5px; margin-bottom: 10px;
            color: #543847; font-size: 0.6rem;
            max-height: 180px; overflow-y: auto;
        }
        
        .rank-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 5px 0; border-bottom: 1px dashed #543847;
            text-align: left;
        }
        .rank-row:last-child { border-bottom: none; }
        .rank-me { color: #E86101; font-weight: bold; }
        .city-tag { font-size: 0.4rem; color: #777; display: block; }

        #user-info {
            position: absolute; top: 10px; left: 10px;
            font-size: 0.5rem; color: white; z-index: 25;
            text-shadow: 1px 1px 0 #000;
            display: flex; align-items: center; gap: 5px;
        }
        #user-photo { width: 24px; height: 24px; border-radius: 50%; border: 1px solid white;}
        #location-badge {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.5); color: white;
            padding: 5px; border-radius: 4px; font-size: 0.5rem;
            z-index: 25; display: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="user-info" style="display:none;">
            <img id="user-photo" src="" alt="user">
            <div>
                <div id="user-name">Player</div>
            </div>
            <button onclick="logout()" style="font-size:0.5rem; padding:2px 5px; margin-left:5px; background:red; border:1px solid white; color:white; font-family:inherit; cursor:pointer;">LOGOUT</button>
        </div>

        <div id="location-badge">📍 Detecting...</div>

        <div id="ui-layer">
            <div id="score">0</div>
        </div>

        <div id="login-screen" class="screen" style="display: flex; flex-direction: column;">
            <h1>FLAPPY<br>BIRD</h1>
            <p style="color:white; font-size:0.6rem; margin-bottom:20px; line-height:1.5;">COMPETE WITH PLAYERS<br>IN YOUR CITY!</p>
            <button class="btn btn-google" onclick="loginGoogle()">LOGIN WITH GOOGLE</button>
            <button class="btn" onclick="playOffline()">MAIN TANPA LOGIN</button>
        </div>

        <div id="start-screen" class="screen">
            <h1>READY?</h1>
            <div style="font-size: 0.6rem; color: #fff; margin-bottom: 10px;">Location: <span id="start-location">Unknown</span></div>
            <button class="btn" onclick="startGame()">START GAME</button>
        </div>

        <div id="game-over-screen" class="screen">
            <h1 style="font-size:1.2rem; margin-bottom:5px;">GAME OVER</h1>
            
            <div class="leaderboard-box" style="padding: 5px; background: #E8D6A5;">
                <div style="text-align: center; font-size: 0.6rem;">YOUR SCORE</div>
                <div id="final-score" style="font-size: 1.8rem; text-align: center; color:#E86101; margin: 5px 0;">0</div>
                <button class="btn btn-share" onclick="shareScore()" style="margin-top: 5px; padding: 8px;">SHARE SCORE 📢</button>
            </div>

            <div style="display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; margin-top: 15px;">
                <button id="btn-tab-world" class="btn btn-small btn-active" onclick="switchTab('world')">WORLD 🌍</button>
                <button id="btn-tab-city" class="btn btn-small" onclick="switchTab('city')">MY CITY 🏘️</button>
            </div>

            <div class="leaderboard-box">
                <div id="leaderboard-title" style="text-align: center; border-bottom: 2px solid #543847; margin-bottom:5px; padding-bottom:5px;">TOP WORLD</div>
                <div id="leaderboard-list">Loading...</div>
            </div>

            <button class="btn" onclick="resetGame()">RETRY</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, query, orderBy, limit, getDocs, where } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // --- 1. SETUP FIREBASE (ISI KEMBALI CONFIG ANDA DI SINI) ---
        const firebaseConfig = {
            apiKey: "GANTI_DENGAN_API_KEY_ANDA",
            authDomain: "GANTI_DENGAN_PROJECT_ID.firebaseapp.com",
            projectId: "GANTI_DENGAN_PROJECT_ID",
            storageBucket: "GANTI_DENGAN_PROJECT_ID.appspot.com",
            messagingSenderId: "GANTI_DENGAN_SENDER_ID",
            appId: "GANTI_DENGAN_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let userLocation = { city: "Unknown", country: "Unknown" };
        let currentTab = 'world';

        // --- DETEKSI LOKASI ---
        async function detectLocation() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                if (data.city) {
                    userLocation = { city: data.city, country: data.country_name };
                    document.getElementById('location-badge').style.display = 'block';
                    document.getElementById('location-badge').innerText = `📍 ${userLocation.city}`;
                    document.getElementById('start-location').innerText = userLocation.city;
                    document.getElementById('btn-tab-city').innerText = `${userLocation.city.toUpperCase()} 🏘️`;
                }
            } catch (e) { console.log("Loc error"); }
        }
        detectLocation();

        // --- AUTH LOGIC ---
        window.loginGoogle = () => signInWithPopup(auth, provider).catch(e => alert(e.message));
        window.logout = () => signOut(auth).then(() => window.location.reload());
        window.playOffline = () => {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'block';
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('start-screen').style.display = 'block';
                document.getElementById('user-info').style.display = 'flex';
                document.getElementById('user-name').innerText = user.displayName.split(' ')[0];
                document.getElementById('user-photo').src = user.photoURL;
            } else {
                currentUser = null;
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('user-info').style.display = 'none';
            }
        });

        // --- SAVE SCORE ---
        async function saveScoreToFirebase(score, startTime) {
            if (!currentUser) return;
            const duration = (Date.now() - startTime) / 1000;
            if (score > 5 && duration < score * 0.8) { console.warn("Cheat detected"); return; }

            try {
                const userRef = doc(db, "scores", currentUser.uid);
                const docSnap = await getDoc(userRef);
                let oldScore = docSnap.exists() ? docSnap.data().score : 0;
                
                if (score > oldScore || (docSnap.exists() && !docSnap.data().city)) {
                    await setDoc(userRef, {
                        name: currentUser.displayName, photo: currentUser.photoURL,
                        score: Math.max(score, oldScore), timestamp: Date.now(),
                        city: userLocation.city, country: userLocation.country
                    }, { merge: true });
                }
                refreshLeaderboard();
            } catch (e) { console.error("Save error:", e); }
        }

        // --- LEADERBOARD ---
        window.switchTab = (tab) => {
            currentTab = tab;
            document.getElementById('btn-tab-world').className = tab === 'world' ? 'btn btn-small btn-active' : 'btn btn-small';
            document.getElementById('btn-tab-city').className = tab === 'city' ? 'btn btn-small btn-active' : 'btn btn-small';
            refreshLeaderboard();
        };

        async function refreshLeaderboard() {
            const listEl = document.getElementById('leaderboard-list');
            const titleEl = document.getElementById('leaderboard-title');
            listEl.innerHTML = "Loading...";
            
            let q; const scoresRef = collection(db, "scores");
            try {
                if (currentTab === 'world') {
                    titleEl.innerText = "TOP WORLD 🌍";
                    q = query(scoresRef, orderBy("score", "desc"), limit(10));
                } else {
                    titleEl.innerText = `TOP ${userLocation.city.toUpperCase()} 🏘️`;
                    q = query(scoresRef, where("city", "==", userLocation.city), orderBy("score", "desc"), limit(10));
                }
                const querySnapshot = await getDocs(q);
                if (querySnapshot.empty) { listEl.innerHTML = "<div style='text-align:center; padding:10px;'>No data yet.</div>"; return; }

                let html = ""; let rank = 1;
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const isMe = currentUser && doc.id === currentUser.uid;
                    const locTag = currentTab === 'world' && data.city ? `<span class="city-tag">📍 ${data.city}</span>` : '';
                    html += `<div class="rank-row ${isMe ? 'rank-me' : ''}"><div style="display:flex;align-items:center;gap:5px;width:70%;"><span style="width:20px;">#${rank}</span><div style="display:flex;flex-direction:column;overflow:hidden;"><span style="white-space:nowrap;">${data.name.substring(0, 12)}</span>${locTag}</div></div><span>${data.score}</span></div>`;
                    rank++;
                });
                listEl.innerHTML = html;
            } catch (error) {
                if (error.message.includes("indexes")) listEl.innerHTML = "<div style='color:red;font-size:0.5rem;'>Need Index defined in Firebase Console.</div>";
                else listEl.innerHTML = "Failed to load.";
            }
        }

        window.submitGameScore = (score, startTime) => { saveScoreToFirebase(score, startTime); };
    </script>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const gameContainer = document.getElementById('game-container');

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const CONFIG = {
            gravity: 0.45, jumpStrength: 7.5, pipeGap: 110, pipeSpeed: 2.5, pipeSpawnRate: 110 
        };

        let frames = 0, score = 0, isGameRunning = false, gameStartTime = 0;

        // --- DAY/NIGHT CYCLE & BACKGROUND ---
        const bgColors = {
            daySky: [112, 197, 206], nightSky: [20, 24, 82],
            dayMtn: [86, 161, 171], nightMtn: [15, 18, 60],
            dayCloud: [255, 255, 255], nightCloud: [80, 80, 120]
        };

        function lerpColor(a, b, amount) {
            const r = a[0] + amount * (b[0] - a[0]);
            const g = a[1] + amount * (b[1] - a[1]);
            const b = a[2] + amount * (b[2] - a[2]);
            return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
        }

        const clouds = [], mountains = [];
        function initBackground() {
            for(let i=0; i<5; i++) clouds.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height/2, speed: 0.5 + Math.random()*0.5, size: 20+Math.random()*30});
            for(let i=0; i<4; i++) mountains.push({x: i*(canvas.width/3), y: canvas.height-150, w: canvas.width/3 + 20, h: 100 + Math.random()*100});
        }
        initBackground();

        function drawBackground(cyclePos) {
            // 1. Sky Color Interpolation
            const skyColor = lerpColor(bgColors.daySky, bgColors.nightSky, cyclePos);
            const mtnColor = lerpColor(bgColors.dayMtn, bgColors.nightMtn, cyclePos);
            const cloudColor = lerpColor(bgColors.dayCloud, bgColors.nightCloud, cyclePos);
            gameContainer.style.background = skyColor;
            ctx.fillStyle = skyColor; ctx.fillRect(0,0,canvas.width,canvas.height);

            // 2. Clouds (Parallax Slowest)
            ctx.fillStyle = cloudColor;
            clouds.forEach(c => {
                ctx.beginPath(); ctx.arc(c.x, c.y, c.size, 0, Math.PI*2); ctx.arc(c.x+c.size*0.7, c.y-c.size*0.2, c.size*0.8, 0, Math.PI*2); ctx.fill();
                if(isGameRunning) c.x -= c.speed * 0.3; if(c.x+c.size*2 < 0) c.x = canvas.width + c.size;
            });

            // 3. Mountains (Parallax Slower)
            ctx.fillStyle = mtnColor;
            mountains.forEach(m => {
                ctx.beginPath(); ctx.moveTo(m.x, canvas.height-112); ctx.lineTo(m.x+m.w/2, canvas.height-112-m.h); ctx.lineTo(m.x+m.w, canvas.height-112); ctx.fill();
                if(isGameRunning) m.x -= CONFIG.pipeSpeed * 0.2; if(m.x+m.w < 0) m.x = canvas.width;
            });
        }

        // --- BIRD (Enhanced with Wing Animation) ---
        const bird = {
            x: 50, y: 150, radius: 14, velocity: 0, rotation: 0, wingState: 0,
            draw: function() {
                ctx.save(); ctx.translate(this.x, this.y);
                this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.12)));
                ctx.rotate(this.rotation);
                
                // Body
                ctx.beginPath(); ctx.ellipse(0, 0, 15, 12, 0, 0, Math.PI*2); 
                ctx.fillStyle = "#FFD700"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#000"; ctx.stroke();
                // Eye
                ctx.beginPath(); ctx.arc(8, -5, 7, 0, Math.PI*2); ctx.fillStyle = "#FFF"; ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(10, -5, 2.5, 0, Math.PI*2); ctx.fillStyle = "#000"; ctx.fill();
                // Beak
                ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(22, 5); ctx.lineTo(12, 10); ctx.closePath(); ctx.fillStyle = "#E86101"; ctx.fill(); ctx.stroke();
                
                // Wing Animation State
                // Jika velocity negatif (lompat), sayap di bawah. Jika positif (jatuh), sayap di atas.
                let wingY = this.velocity < 0 ? 5 : -3;
                
                // Wing
                ctx.beginPath(); ctx.ellipse(-5, wingY, 8, 5, -0.2, 0, Math.PI*2); 
                ctx.fillStyle = "#FFF"; ctx.fill(); ctx.stroke();
                
                ctx.restore();
            },
            update: function() {
                this.velocity += CONFIG.gravity; this.y += this.velocity;
                if (this.y + this.radius >= canvas.height - 112) { this.y = canvas.height - 112 - this.radius; gameOver(); }
                if (this.y - this.radius <= 0) { this.y = this.radius; this.velocity = 0; }
            },
            flap: function() { this.velocity = -CONFIG.jumpStrength; }
        };

        // --- PIPES & GROUND (Sama seperti sebelumnya) ---
        const pipes = {
            position: [], w: 52,
            draw: function() {
                for (let p of this.position) {
                    let topY = p.y, bottomY = p.y + CONFIG.pipeGap;
                    ctx.fillStyle = "#73BF2E"; ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
                    ctx.fillRect(p.x, 0, this.w, topY); ctx.strokeRect(p.x, -2, this.w, topY+2);
                    ctx.fillRect(p.x - 2, topY - 24, this.w + 4, 24); ctx.strokeRect(p.x - 2, topY - 24, this.w + 4, 24);
                    let botH = canvas.height - 112 - bottomY;
                    ctx.fillRect(p.x, bottomY, this.w, botH); ctx.strokeRect(p.x, bottomY, this.w, botH+2);
                    ctx.fillRect(p.x - 2, bottomY, this.w + 4, 24); ctx.strokeRect(p.x - 2, bottomY, this.w + 4, 24);
                }
            },
            update: function() {
                if (frames % CONFIG.pipeSpawnRate === 0) {
                    let minP = 50, maxP = canvas.height - 112 - CONFIG.pipeGap - 50;
                    this.position.push({ x: canvas.width, y: Math.floor(Math.random() * (maxP - minP + 1) + minP), passed: false });
                }
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i]; p.x -= CONFIG.pipeSpeed;
                    let bL = bird.x-10, bR = bird.x+10, bT = bird.y-10, bB = bird.y+10;
                    if (bR > p.x && bL < p.x + this.w && (bT < p.y || bB > p.y + CONFIG.pipeGap)) gameOver();
                    if (p.x + this.w < bird.x && !p.passed) { score++; scoreEl.innerText = score; p.passed = true; }
                    if (p.x + this.w < 0) { this.position.shift(); i--; }
                }
            },
            reset: function() { this.position = []; }
        };

        const ground = {
            x: 0, h: 112,
            draw: function() {
                let ty = canvas.height - this.h;
                ctx.fillStyle = "#DED895"; ctx.fillRect(0, ty, canvas.width, this.h);
                ctx.beginPath(); ctx.moveTo(0, ty); ctx.lineTo(canvas.width, ty); ctx.strokeStyle = "#543847"; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = "#73BF2E"; ctx.fillRect(0, ty, canvas.width, 12);
                ctx.beginPath(); ctx.moveTo(0, ty+12); ctx.lineTo(canvas.width, ty+12); ctx.strokeStyle = "#558C22"; ctx.lineWidth = 2; ctx.stroke();
                // Grass details
                ctx.strokeStyle = "#558C22"; ctx.lineWidth = 1;
                for(let i=0; i<canvas.width/10; i++) { ctx.beginPath(); ctx.moveTo(this.x%10 + i*10, ty+2); ctx.lineTo(this.x%10 + i*10 + 5, ty+10); ctx.stroke(); }
            },
            update: function() { this.x -= CONFIG.pipeSpeed; }
        };

        // --- GAME CONTROL & SHARE FUNCTION ---
        window.startGame = () => {
            startScreen.style.display = 'none'; gameOverScreen.style.display = 'none';
            isGameRunning = true; bird.y = canvas.height / 2; bird.velocity = 0;
            score = 0; frames = 0; scoreEl.innerText = 0; pipes.reset();
            gameStartTime = Date.now();
            loop();
        };

        function gameOver() {
            if (!isGameRunning) return;
            isGameRunning = false;
            finalScoreEl.innerText = score;
            scoreEl.innerText = "";
            gameOverScreen.style.display = 'block';
            if (window.submitGameScore) window.submitGameScore(score, gameStartTime);
            window.switchTab('world');
        }

        window.resetGame = () => window.startGame();
        
        // FITUR SHARE SCORE (WhatsApp / Native)
        window.shareScore = async () => {
            const shareData = {
                title: 'Flappy Bird Challenge',
                text: `Saya baru saja mendapatkan skor ${score} di Flappy Bird Regional! Coba kalahkan skor saya! 📍${userLocation.city || 'World'}`,
                url: window.location.href // Link website Anda saat ini
            };

            // Cek apakah browser mendukung fitur Share native (HP modern biasanya dukung)
            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    console.log('Share dibatalkan/gagal', err);
                }
            } else {
                // Fallback manual ke WhatsApp Web jika native share tidak didukung
                const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(shareData.text + ' ' + shareData.url)}`;
                window.open(whatsappUrl, '_blank');
            }
        };


        function input(e) { if((e.type!=='keydown'||e.code==='Space') && isGameRunning) bird.flap(); }
        window.addEventListener('keydown', input);
        canvas.addEventListener('touchstart', (e)=>{input(e);e.preventDefault()}, {passive:false});
        canvas.addEventListener('mousedown', input);

        function loop() {
            if (!isGameRunning) return;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            
            // Calculate Day/Night cycle position (0.0 = Noon, 1.0 = Midnight)
            // Cycle every 3000 frames (~50 seconds)
            let cyclePos = (Math.sin(frames / 3000 * Math.PI * 2) + 1) / 2; 
            drawBackground(cyclePos);
            
            pipes.update(); pipes.draw(); 
            ground.update(); ground.draw(); 
            bird.update(); bird.draw();
            frames++; requestAnimationFrame(loop);
        }
        
        // Initial draw before start
        drawBackground(0); 
        ground.draw();
    </script>
</body>
</html>
