<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird GitHub</title>
    <style>
        /* CSS: Tampilan & UI */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none; /* Mencegah scroll saat main di HP */
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px; /* Batas lebar agar mirip tampilan HP */
            height: 100%;
            max-height: 600px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(#4EC0CA, #ffffff); /* Warna langit */
        }

        /* Tampilan Skor & Menu */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Supaya klik tembus ke canvas */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #score {
            font-size: 3rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 0 #000;
            margin-top: 20px;
            z-index: 10;
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            color: white;
            pointer-events: auto; /* Tombol harus bisa diklik */
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #game-over-screen {
            display: none;
        }

        button {
            background: #E86101;
            border: 2px solid white;
            color: white;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-family: inherit;
            cursor: pointer;
            border-radius: 5px;
        }

        button:active {
            background: #c45200;
        }

        h1 { margin: 0 0 10px 0; color: #F4D03F; text-shadow: 2px 2px #000; }
        p { margin: 0; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div id="score">0</div>
        </div>

        <div id="start-screen">
            <h1>FLAPPY BIRD</h1>
            <p>Tekan SPASI atau KLIK layar<br>untuk lompat</p>
            <br>
            <button onclick="startGame()">MULAI</button>
        </div>

        <div id="game-over-screen">
            <h1>GAME OVER</h1>
            <p>Skor Akhir: <span id="final-score">0</span></p>
            <br>
            <button onclick="resetGame()">MAIN LAGI</button>
        </div>
    </div>

    <script>
        // JAVASCRIPT: Logika Game
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');

        // Atur ukuran canvas agar tajam
        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Variabel Game
        let frames = 0;
        let score = 0;
        let isGameRunning = false;
        let isGameOver = false;
        let gameSpeed = 3;

        // Objek Burung
        const bird = {
            x: 50,
            y: 150,
            w: 30,
            h: 30,
            radius: 12,
            velocity: 0,
            gravity: 0.25,
            jump: 5.5, // Kekuatan lompat
            rotation: 0,
            
            draw: function() {
                ctx.save();
                ctx.translate(this.x, this.y);
                // Rotasi berdasarkan kecepatan (nukik ke bawah atau dongak ke atas)
                this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
                ctx.rotate(this.rotation);
                
                // Gambar Badan Burung
                ctx.fillStyle = "#FFD700"; // Kuning Emas
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = "#000";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Gambar Mata
                ctx.fillStyle = "#FFF";
                ctx.beginPath();
                ctx.arc(6, -6, 5, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#000";
                ctx.beginPath();
                ctx.arc(8, -6, 2, 0, Math.PI*2);
                ctx.fill();

                // Gambar Paruh
                ctx.fillStyle = "#E86101";
                ctx.beginPath();
                ctx.moveTo(6, 4);
                ctx.lineTo(16, 8);
                ctx.lineTo(6, 12);
                ctx.fill();
                
                ctx.restore();
            },
            
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                // Cek tabrakan dengan tanah
                if (this.y + this.radius >= canvas.height - 20) { // 20px adalah tinggi tanah
                    gameOver();
                }
                
                // Cek tabrakan dengan atap (opsional, biar tidak terbang ke luar layar terus)
                if (this.y - this.radius <= 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }
            },
            
            flap: function() {
                this.velocity = -this.jump;
            }
        };

        // Objek Pipa
        const pipes = {
            position: [],
            width: 50,
            gap: 140, // Jarak antar pipa atas dan bawah
            dx: gameSpeed,

            draw: function() {
                ctx.fillStyle = "#73BF2E"; // Hijau Pipa
                ctx.strokeStyle = "#558C22"; // Border Hijau Gelap
                ctx.lineWidth = 2;

                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    let topY = p.y;
                    let bottomY = p.y + this.gap;

                    // Pipa Atas
                    ctx.fillRect(p.x, 0, this.width, topY);
                    ctx.strokeRect(p.x, 0, this.width, topY); // Border
                    // Kepala Pipa Atas
                    ctx.fillRect(p.x - 2, topY - 20, this.width + 4, 20);
                    ctx.strokeRect(p.x - 2, topY - 20, this.width + 4, 20);

                    // Pipa Bawah
                    ctx.fillRect(p.x, bottomY, this.width, canvas.height - bottomY);
                    ctx.strokeRect(p.x, bottomY, this.width, canvas.height - bottomY);
                    // Kepala Pipa Bawah
                    ctx.fillRect(p.x - 2, bottomY, this.width + 4, 20);
                    ctx.strokeRect(p.x - 2, bottomY, this.width + 4, 20);
                }
            },

            update: function() {
                // Tambah pipa baru setiap 120 frame (sekitar 2 detik)
                if (frames % 120 === 0) {
                    // Random posisi Y pipa
                    let maxY = canvas.height - 150 - this.gap; // Min height bawah
                    let minY = 50; // Min height atas
                    this.position.push({
                        x: canvas.width,
                        y: Math.floor(Math.random() * (maxY - minY + 1) + minY),
                        passed: false
                    });
                }

                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    p.x -= this.dx;

                    // Deteksi Tabrakan
                    // Logika: Burung ada di dalam area horizontal pipa && (Burung kena pipa atas || Burung kena pipa bawah)
                    let birdLeft = bird.x - bird.radius;
                    let birdRight = bird.x + bird.radius;
                    let birdTop = bird.y - bird.radius;
                    let birdBottom = bird.y + bird.radius;

                    let pipeLeft = p.x;
                    let pipeRight = p.x + this.width;
                    let pipeTopY = p.y;
                    let pipeBottomY = p.y + this.gap;

                    if (birdRight > pipeLeft && birdLeft < pipeRight) {
                        if (birdTop < pipeTopY || birdBottom > pipeBottomY) {
                            gameOver();
                        }
                    }

                    // Tambah Skor
                    if (p.x + this.width < bird.x && !p.passed) {
                        score++;
                        scoreEl.innerText = score;
                        p.passed = true;
                    }

                    // Hapus pipa yang sudah lewat layar
                    if (p.x + this.width < 0) {
                        this.position.shift();
                    }
                }
            },
            
            reset: function() {
                this.position = [];
            }
        };

        // Background Tanah Bergerak
        const ground = {
            x: 0,
            h: 20,
            draw: function() {
                ctx.fillStyle = "#DED895";
                ctx.fillRect(0, canvas.height - this.h, canvas.width, this.h);
                // Garis atas tanah
                ctx.beginPath();
                ctx.moveTo(0, canvas.height - this.h);
                ctx.lineTo(canvas.width, canvas.height - this.h);
                ctx.strokeStyle = "#73BF2E";
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Efek bergerak
                ctx.fillStyle = "#CBB968";
                for(let i=0; i<canvas.width / 20 + 1; i++) {
                    ctx.beginPath();
                    // Pola miring
                    ctx.moveTo(this.x + i * 20, canvas.height - this.h);
                    ctx.lineTo(this.x + i * 20 - 10, canvas.height);
                    ctx.stroke();
                }
            },
            update: function() {
                this.x -= gameSpeed;
                if (this.x <= -20) this.x = 0;
            }
        };

        // Fungsi Kontrol
        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            isGameRunning = true;
            isGameOver = false;
            bird.y = 150;
            bird.velocity = 0;
            score = 0;
            frames = 0;
            scoreEl.innerText = score;
            pipes.reset();
            loop();
        }

        function gameOver() {
            isGameRunning = false;
            isGameOver = true;
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'flex';
        }

        function resetGame() {
            startGame();
        }

        function inputAction(e) {
            // Mencegah default behavior (scroll dll)
            if (e.type === 'keydown' && e.code !== 'Space') return;
            // e.preventDefault(); 

            if (isGameRunning) {
                bird.flap();
            } else if (isGameOver) {
                // Optional: Klik untuk restart langsung
                // resetGame(); 
            }
        }

        // Event Listeners
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') inputAction(e);
        });
        
        // Support Mouse & Touch
        canvas.addEventListener('mousedown', inputAction);
        canvas.addEventListener('touchstart', (e) => {
            inputAction(e);
            e.preventDefault(); // Mencegah double tap zoom
        }, {passive: false});


        // Game Loop Utama
        function loop() {
            if (!isGameRunning) return;

            // Bersihkan Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update Logika
            pipes.update();
            bird.update();
            ground.update();
            frames++;

            // Gambar Objek
            pipes.draw();
            ground.draw(); // Tanah di atas pipa
            bird.draw();   // Burung paling depan

            requestAnimationFrame(loop);
        }

        // Gambar awal (sebelum start)
        function initDraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ground.draw();
            bird.y = canvas.height / 2 - 20;
            bird.draw();
        }
        
        // Panggil gambar awal
        initDraw();

    </script>
</body>
</html>
