<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Remastered</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
            font-family: 'Press Start 2P', cursive; /* Font Pixel Style */
            overflow: hidden;
            touch-action: none; 
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px; 
            height: 100%;
            max-height: 600px;
            background: #70C5CE; /* Warna langit klasik */
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 20;
        }

        #score {
            font-size: 3rem;
            color: white;
            -webkit-text-stroke: 2px #000;
            text-shadow: 2px 2px 0 #000;
        }

        .screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 80%;
            z-index: 30;
        }

        #start-screen button, #game-over-screen button {
            background: #E86101;
            border: 2px solid #fff;
            box-shadow: 0 4px 0 #994000;
            color: white;
            padding: 15px 20px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
            text-transform: uppercase;
        }

        #start-screen button:active, #game-over-screen button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #994000;
        }

        h1 { 
            color: #F4D03F; 
            -webkit-text-stroke: 1.5px #000;
            text-shadow: 3px 3px 0 #000;
            line-height: 1.5;
            font-size: 1.8rem;
        }
        
        p { color: white; text-shadow: 1px 1px 0 #000; font-size: 0.8rem; line-height: 1.5;}

        #game-over-screen { display: none; }
        
        /* Panel skor putih di game over */
        .score-board {
            background: #DED895;
            border: 2px solid #543847;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 10px;
            color: #E86101;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div id="score">0</div>
        </div>

        <div id="start-screen" class="screen">
            <h1>FLAPPY<br>BIRD</h1>
            <button onclick="startGame()">START</button>
        </div>

        <div id="game-over-screen" class="screen">
            <h1>GAME OVER</h1>
            <div class="score-board">
                <p>SCORE</p>
                <div id="final-score" style="font-size: 1.5rem; margin-top:5px;">0</div>
                <br>
                <p>BEST</p>
                <div id="best-score" style="font-size: 1.5rem; margin-top:5px;">0</div>
            </div>
            <button onclick="resetGame()">RETRY</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('final-score');
        const bestScoreEl = document.getElementById('best-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- KONFIGURASI KESULITAN ---
        // Gravity lebih tinggi = jatuh lebih cepat (terasa berat)
        // Gap lebih kecil = lebih sulit masuk pipa
        const CONFIG = {
            gravity: 0.45,   
            jumpStrength: 7.5, 
            pipeGap: 105,     // Jarak vertikal pipa (Sempit!)
            pipeSpeed: 2.5,   // Kecepatan gerak pipa
            pipeSpawnRate: 110 // Jarak antar pipa baru (frame)
        };

        let frames = 0;
        let score = 0;
        let highScore = localStorage.getItem('flappyHighScore') || 0;
        let isGameRunning = false;
        let isGameOver = false;

        const bird = {
            x: 50,
            y: 150,
            radius: 14, // Hitbox radius
            velocity: 0,
            rotation: 0,
            
            draw: function() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Rotasi: Nukik tajam saat jatuh, dongak saat lompat
                let targetRotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.12)));
                this.rotation = targetRotation;
                ctx.rotate(this.rotation);

                // 1. Badan (Kuning)
                ctx.beginPath();
                ctx.arc(0, 0, 15, 0, Math.PI*2);
                ctx.fillStyle = "#FFD700";
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#000";
                ctx.stroke();

                // 2. Mata Besar (Putih & Pupil Hitam)
                // Putih mata
                ctx.beginPath();
                ctx.arc(6, -6, 8, 0, Math.PI*2); 
                ctx.fillStyle = "#FFF";
                ctx.fill();
                ctx.stroke(); // Outline mata
                // Pupil
                ctx.beginPath();
                ctx.arc(8, -6, 2, 0, Math.PI*2); 
                ctx.fillStyle = "#000";
                ctx.fill();

                // 3. Paruh (Oranye Tebal)
                ctx.beginPath();
                ctx.moveTo(8, 2);
                ctx.lineTo(20, 8); // Ujung paruh
                ctx.lineTo(8, 14);
                ctx.closePath();
                ctx.fillStyle = "#E86101";
                ctx.fill();
                ctx.stroke();

                // 4. Sayap (Putih kecil di tengah)
                ctx.beginPath();
                ctx.ellipse(-6, 4, 8, 5, -0.2, 0, Math.PI*2);
                ctx.fillStyle = "#FFF";
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            },
            
            update: function() {
                this.velocity += CONFIG.gravity;
                this.y += this.velocity;

                // Tabrakan lantai
                if (this.y + this.radius >= canvas.height - ground.h) {
                    this.y = canvas.height - ground.h - this.radius;
                    gameOver();
                }
                
                // Atap limit
                if (this.y - this.radius <= 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }
            },
            
            flap: function() {
                this.velocity = -CONFIG.jumpStrength;
            }
        };

        const pipes = {
            position: [],
            w: 52, // Lebar pipa klasik
            
            draw: function() {
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    let topY = p.y;
                    let bottomY = p.y + CONFIG.pipeGap;

                    // Pipa Hijau dengan Outline Hitam (Style Kartun)
                    ctx.fillStyle = "#73BF2E";
                    ctx.strokeStyle = "#000";
                    ctx.lineWidth = 2;

                    // Pipa Atas
                    ctx.fillRect(p.x, 0, this.w, topY);
                    ctx.strokeRect(p.x, -2, this.w, topY+2); // -2 biar border atas hilang
                    
                    // Kepala Pipa Atas (Lebih lebar dikit)
                    ctx.fillRect(p.x - 2, topY - 24, this.w + 4, 24);
                    ctx.strokeRect(p.x - 2, topY - 24, this.w + 4, 24);
                    
                    // Highlight Pipa (Efek Kilap)
                    ctx.fillStyle = "#9CE659"; // Hijau muda
                    ctx.fillRect(p.x + 4, 0, 4, topY - 24); // Garis kilap badan
                    ctx.fillRect(p.x + 2, topY - 24, 4, 22); // Garis kilap kepala

                    // --- Pipa Bawah ---
                    ctx.fillStyle = "#73BF2E";
                    let botH = canvas.height - ground.h - bottomY;
                    
                    ctx.fillRect(p.x, bottomY, this.w, botH);
                    ctx.strokeRect(p.x, bottomY, this.w, botH+2); // +2 border bawah hilang
                    
                    // Kepala Pipa Bawah
                    ctx.fillRect(p.x - 2, bottomY, this.w + 4, 24);
                    ctx.strokeRect(p.x - 2, bottomY, this.w + 4, 24);

                    // Highlight Pipa Bawah
                    ctx.fillStyle = "#9CE659"; 
                    ctx.fillRect(p.x + 4, bottomY + 26, 4, botH); 
                    ctx.fillRect(p.x + 2, bottomY + 2, 4, 20); 

                }
            },

            update: function() {
                if (frames % CONFIG.pipeSpawnRate === 0) {
                    // Logic Random Pipa (Memastikan celah selalu bisa dilewati tapi sulit)
                    let minP = 50;
                    let maxP = canvas.height - ground.h - CONFIG.pipeGap - 50;
                    let y = Math.floor(Math.random() * (maxP - minP + 1) + minP);
                    
                    this.position.push({
                        x: canvas.width,
                        y: y,
                        passed: false
                    });
                }

                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    p.x -= CONFIG.pipeSpeed;

                    // Collision Detection (Hitbox kotak vs Lingkaran Burung)
                    // Disederhanakan menjadi kotak vs kotak agar fair untuk player
                    let birdLeft = bird.x - bird.radius + 4; // Tolerance dikit
                    let birdRight = bird.x + bird.radius - 4;
                    let birdTop = bird.y - bird.radius + 4;
                    let birdBottom = bird.y + bird.radius - 4;

                    let pipeLeft = p.x;
                    let pipeRight = p.x + this.w;
                    let pipeTopY = p.y;
                    let pipeBottomY = p.y + CONFIG.pipeGap;

                    // Cek Tabrakan Horizontal
                    if (birdRight > pipeLeft && birdLeft < pipeRight) {
                        // Cek Tabrakan Vertikal (Kena atas atau Kena bawah)
                        if (birdTop < pipeTopY || birdBottom > pipeBottomY) {
                            gameOver();
                        }
                    }

                    if (p.x + this.w < bird.x && !p.passed) {
                        score++;
                        scoreEl.innerText = score;
                        p.passed = true;
                    }

                    if (p.x + this.w < 0) {
                        this.position.shift();
                        i--; // Adjust index karena array berkurang
                    }
                }
            },
            reset: function() { this.position = []; }
        };

        const ground = {
            x: 0,
            h: 112, // Tanah tinggi seperti game asli
            draw: function() {
                // Pola Tanah
                ctx.fillStyle = "#DED895";
                let topGroundY = canvas.height - this.h;
                ctx.fillRect(0, topGroundY, canvas.width, this.h);
                
                // Garis Border Tanah
                ctx.beginPath();
                ctx.moveTo(0, topGroundY);
                ctx.lineTo(canvas.width, topGroundY);
                ctx.strokeStyle = "#543847";
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Rumput hijau di atas tanah
                ctx.fillStyle = "#73BF2E";
                ctx.fillRect(0, topGroundY, canvas.width, 12);
                ctx.beginPath();
                ctx.moveTo(0, topGroundY + 12);
                ctx.lineTo(canvas.width, topGroundY + 12);
                ctx.strokeStyle = "#558C22";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Pattern miring (Parallax effect)
                ctx.strokeStyle = "#D0C874"; 
                ctx.lineWidth = 2;
                for(let i=0; i<canvas.width / 20 + 2; i++) {
                    let offset = this.x % 20;
                    let startX = (i * 20) + offset;
                    ctx.beginPath();
                    ctx.moveTo(startX, topGroundY + 14);
                    ctx.lineTo(startX - 10, canvas.height);
                    ctx.stroke();
                }
            },
            update: function() {
                this.x -= CONFIG.pipeSpeed;
            }
        };

        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            isGameRunning = true;
            isGameOver = false;
            bird.y = canvas.height / 2;
            bird.velocity = 0;
            bird.rotation = 0;
            score = 0;
            frames = 0;
            scoreEl.innerText = score;
            pipes.reset();
            loop();
        }

        function gameOver() {
            isGameRunning = false;
            isGameOver = true;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappyHighScore', highScore);
            }

            finalScoreEl.innerText = score;
            bestScoreEl.innerText = highScore;
            gameOverScreen.style.display = 'block';
            scoreEl.innerText = ""; // Sembunyikan skor main saat game over
        }

        function resetGame() {
            startGame();
        }

        function inputAction(e) {
            if (e.type === 'keydown' && e.code !== 'Space') return;
            if (isGameRunning) {
                bird.flap();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') inputAction(e);
        });
        
        canvas.addEventListener('touchstart', (e) => {
            inputAction(e);
            e.preventDefault();
        }, {passive: false});
        
        canvas.addEventListener('mousedown', inputAction);

        function loop() {
            if (!isGameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background Pemandangan Statis (Gedung jauh) - Opsional Simpel
            ctx.fillStyle = "#A3E4E8"; // Sedikit beda dr langit atas
            ctx.fillRect(0, canvas.height - ground.h - 50, canvas.width, 50);

            pipes.update();
            pipes.draw();
            
            ground.update();
            ground.draw();
            
            bird.update();
            bird.draw();
            
            frames++;
            requestAnimationFrame(loop);
        }

        // Initial Draw
        ground.draw();
        
    </script>
</body>
</html>
