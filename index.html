<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flappy Bird Fixed v2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        /* CSS RESET & LAYOUT */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            /* Menggunakan dvh untuk mengatasi address bar mobile browser */
            height: 100dvh; 
            background-color: #222;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            position: fixed; /* Kunci posisi body */
            width: 100%;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            width: 100%; max-width: 480px; 
            height: 100%; 
            background: #70C5CE; 
            overflow: hidden;
        }

        canvas { display: block; width: 100%; height: 100%; touch-action: none; }

        /* UI LAYERS */
        #ui-layer {
            position: absolute; top: 12%; width: 100%;
            text-align: center; pointer-events: none; z-index: 20;
        }

        #score {
            font-size: 3.5rem; color: white;
            -webkit-text-stroke: 2px #000;
            text-shadow: 4px 4px 0 #000;
        }

        .screen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); 
            backdrop-filter: blur(2px); /* Efek blur modern */
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 30;
            display: none;
        }

        /* BUTTON STYLES */
        .btn {
            background: #E86101; border: 2px solid #fff;
            box-shadow: 0 4px 0 #994000; color: white;
            padding: 15px 20px; font-size: 0.9rem;
            font-family: inherit; cursor: pointer;
            border-radius: 8px; margin: 10px;
            text-transform: uppercase; width: 80%;
            pointer-events: auto;
            transition: transform 0.1s;
            position: relative;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #994000; }
        .btn-google { background: #4285F4; box-shadow: 0 4px 0 #0d47a1; }
        .btn-share { background: #25D366; box-shadow: 0 4px 0 #128C7E; }
        
        .btn-tab-container { display: flex; gap: 8px; margin-top: 10px; width: 85%; }
        .btn-small { width: auto; font-size: 0.6rem; padding: 10px 5px; margin: 0; flex: 1; }
        .btn-active { background: #73BF2E; box-shadow: 0 4px 0 #4c8519; filter: brightness(1.1); }

        h1 { 
            color: #F4D03F; -webkit-text-stroke: 2px #000;
            text-shadow: 4px 4px 0 #000; font-size: 2.2rem; margin-bottom: 25px;
            line-height: 1.4; text-align: center;
        }
        
        .leaderboard-box {
            background: #DED895; border: 3px solid #543847;
            padding: 10px; border-radius: 10px; margin-bottom: 10px;
            color: #543847; font-size: 0.7rem; width: 85%;
            max-height: 220px; overflow-y: auto;
        }
        
        .rank-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 0; border-bottom: 1px dashed #543847; text-align: left;
        }
        .rank-me { color: #E86101; font-weight: bold; background: rgba(232, 97, 1, 0.1); padding: 8px 4px; border-radius: 4px; }
        .city-tag { font-size: 0.5rem; color: #777; display: block; margin-top:2px; }

        #user-info {
            position: absolute; top: 15px; left: 15px;
            font-size: 0.6rem; color: white; z-index: 25;
            text-shadow: 1px 1px 0 #000;
            display: flex; align-items: center; gap: 8px;
        }
        #user-photo { width: 32px; height: 32px; border-radius: 50%; border: 2px solid white;}
        #location-badge {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,0,0,0.6); color: white;
            padding: 6px 10px; border-radius: 20px; font-size: 0.6rem;
            z-index: 25; display: none; border: 1px solid white;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="user-info" style="display:none;">
            <img id="user-photo" src="" alt="user">
            <div><div id="user-name">Player</div></div>
            <button id="btn-logout" style="font-size:0.5rem; padding:4px 8px; background:#ff4444; border:1px solid #fff; color:white; border-radius:4px; font-family:inherit; margin-left: 5px; cursor: pointer;">LOGOUT</button>
        </div>
        <div id="location-badge">📍 Detecting...</div>
        <div id="ui-layer"><div id="score">0</div></div>

        <div id="loading-screen" class="screen" style="display: flex; background: #70C5CE;">
            <h1 style="font-size: 1rem; animation: pulse 1s infinite;">CONNECTING...</h1>
        </div>

        <div id="login-screen" class="screen">
            <h1>FLAPPY<br>BIRD</h1>
            <button id="btn-login" class="btn btn-google">LOGIN WITH GOOGLE</button>
            <button id="btn-offline" class="btn">MAIN TANPA LOGIN</button>
            <div style="margin-top:20px; font-size:0.5rem; color: white;">v2.1 (Fixed Physics)</div>
        </div>

        <div id="start-screen" class="screen">
            <h1>READY?</h1>
            <div style="font-size: 0.7rem; color: #fff; margin-bottom: 20px;">Location: <span id="start-location">Unknown</span></div>
            <button id="btn-start" class="btn">TAP TO START</button>
        </div>

        <div id="game-over-screen" class="screen">
            <div class="leaderboard-box" style="background: #E8D6A5; text-align: center; margin-bottom: 5px;">
                <div style="font-size: 0.6rem; color:#888;">YOUR SCORE</div>
                <div id="final-score" style="font-size: 2.5rem; color:#E86101; margin: 5px 0;">0</div>
                <button id="btn-share" class="btn btn-share" style="width: 100%; margin: 5px 0; padding: 12px; font-size: 0.8rem;">SHARE SCORE 📢</button>
            </div>

            <div class="btn-tab-container">
                <button id="btn-tab-world" class="btn btn-small btn-active">WORLD 🌍</button>
                <button id="btn-tab-city" class="btn btn-small">MY CITY 🏘️</button>
            </div>

            <div class="leaderboard-box">
                <div id="leaderboard-title" style="text-align: center; border-bottom: 2px solid #543847; margin-bottom:5px; padding-bottom:5px;">TOP WORLD</div>
                <div id="leaderboard-list">Loading...</div>
            </div>

            <button id="btn-retry" class="btn" style="margin-top: 5px;">TRY AGAIN</button>
        </div>
    </div>

    <script type="module">
        // 1. ERROR HANDLER GLOBAL
        window.onerror = function(msg, url, line) {
            console.error("Error: " + msg);
            // Jangan alert error ke user jika minor, cukup log
            return false;
        };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, query, orderBy, limit, getDocs, where } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // ==========================================
        // 2. KONFIGURASI FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDH6cBMyBCNdzG_tdJNs28AZZIm8HnO8l4",
            authDomain: "flytap-ca3ee.firebaseapp.com",
            projectId: "flytap-ca3ee",
            storageBucket: "flytap-ca3ee.firebasestorage.app",
            messagingSenderId: "690738199480",
            appId: "1:690738199480:web:b1b442690440db79016d4d"
        };

        let app, auth, db, provider;
        let currentUser = null;
        let userLocation = { city: "Unknown", country: "Unknown" };
        let isOfflineMode = false;

        // Init Firebase dengan Safety Try-Catch
        async function initFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                provider = new GoogleAuthProvider();
                
                onAuthStateChanged(auth, (user) => {
                    document.getElementById('loading-screen').style.display = 'none';
                    if(user) {
                        currentUser = user;
                        showScreen('start');
                        updateUserInfo(user);
                    } else {
                        currentUser = null;
                        showScreen('login');
                    }
                });
            } catch (e) {
                console.error("Firebase Error:", e);
                isOfflineMode = true;
                document.getElementById('loading-screen').style.display = 'none';
                showScreen('login');
                alert("Mode Offline: Fitur Leaderboard tidak aktif.");
            }
        }

        function updateUserInfo(user) {
            const ui = document.getElementById('user-info');
            ui.style.display = 'flex';
            // Fix: Handle jika displayName null
            const name = user.displayName ? user.displayName.split(' ')[0] : 'Player';
            document.getElementById('user-name').innerText = name;
            document.getElementById('user-photo').src = user.photoURL || 'https://via.placeholder.com/30';
        }

        // ==========================================
        // 3. GAME ENGINE (FIXED PHYSICS)
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimasi performa
        
        const screens = {
            loading: document.getElementById('loading-screen'),
            login: document.getElementById('login-screen'),
            start: document.getElementById('start-screen'),
            gameOver: document.getElementById('game-over-screen')
        };

        function showScreen(name) {
            Object.values(screens).forEach(s => s.style.display = 'none');
            if(screens[name]) screens[name].style.display = 'flex';
        }

        // CONFIG DIGANTI UNTUK 60 FPS CONSISTENCY
        const CONFIG = {
            gravity: 0.4, 
            jump: 7, 
            gap: 120, // Sedikit diperlebar agar lebih mudah
            speed: 3, 
            spawnRate: 100
        };

        let state = {
            frames: 0, score: 0, running: false, startTime: 0, 
            clouds: [], mountains: []
        };
        
        // Variables for FPS Control
        let lastTime = 0;
        const fps = 60;
        const interval = 1000/fps;

        // Resize Logic yang lebih pintar
        function resize() {
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            // Redraw background saat resize agar tidak blank
            if(!state.running) {
                drawBg(0);
                ground.draw();
            }
        }
        window.addEventListener('resize', resize);
        // Panggil resize beberapa kali untuk memastikan mobile browser sudah settle
        setTimeout(resize, 500);

        // --- BACKGROUND ---
        const colors = {
            daySky: [112, 197, 206], nightSky: [20, 24, 82],
            dayMtn: [86, 161, 171], nightMtn: [15, 18, 60],
            dayCloud: [255, 255, 255], nightCloud: [80, 80, 120]
        };

        function lerp(a, b, t) { 
            return `rgb(${Math.round(a[0]+t*(b[0]-a[0]))},${Math.round(a[1]+t*(b[1]-a[1]))},${Math.round(a[2]+t*(b[2]-a[2]))})`; 
        }

        function initBg() {
            state.clouds = []; state.mountains = [];
            for(let i=0; i<5; i++) state.clouds.push({x: Math.random()*canvas.width, y: Math.random()*300, s: 0.5+Math.random(), r: 20+Math.random()*20});
            for(let i=0; i<4; i++) state.mountains.push({x: i*(canvas.width/3), w: canvas.width/3+2, h: 100+Math.random()*80});
        }

        function drawBg(pos) {
            const sky = lerp(colors.daySky, colors.nightSky, pos);
            ctx.fillStyle = sky; ctx.fillRect(0,0,canvas.width,canvas.height);
            document.getElementById('game-container').style.background = sky;

            // Clouds
            ctx.fillStyle = lerp(colors.dayCloud, colors.nightCloud, pos);
            state.clouds.forEach(c => {
                ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.fill();
                if(state.running) c.x -= c.s * 0.5; // Slow cloud
                if(c.x < -50) c.x = canvas.width + 50;
            });

            // Mountains
            ctx.fillStyle = lerp(colors.dayMtn, colors.nightMtn, pos);
            state.mountains.forEach(m => {
                ctx.beginPath(); ctx.moveTo(m.x, canvas.height-112); ctx.lineTo(m.x+m.w/2, canvas.height-112-m.h); ctx.lineTo(m.x+m.w, canvas.height-112); ctx.fill();
                if(state.running) m.x -= CONFIG.speed * 0.2;
                if(m.x+m.w < 0) m.x = canvas.width; // Loop
            });
        }

        // --- GAME OBJECTS ---
        const bird = {
            x: 60, y: 200, r: 14, v: 0,
            draw: function() {
                ctx.save(); ctx.translate(this.x, this.y);
                let rot = Math.min(Math.PI/4, Math.max(-Math.PI/4, this.v*0.1));
                ctx.rotate(rot);
                
                // Bird Art
                ctx.beginPath(); ctx.ellipse(0,0,16,13,0,0,Math.PI*2);
                ctx.fillStyle="#FFD700"; ctx.fill(); ctx.stroke(); 
                ctx.beginPath(); ctx.arc(8,-6,6,0,Math.PI*2); ctx.fillStyle="#FFF"; ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(10,-6,2,0,Math.PI*2); ctx.fillStyle="#000"; ctx.fill(); 
                ctx.beginPath(); ctx.moveTo(10,2); ctx.lineTo(22,8); ctx.lineTo(10,14); ctx.fillStyle="#E86101"; ctx.fill(); ctx.stroke();
                let wingY = this.v < 0 ? 6 : -4;
                ctx.beginPath(); ctx.ellipse(-6,wingY,9,6,-0.2,0,Math.PI*2); ctx.fillStyle="#FFF"; ctx.fill(); ctx.stroke();
                
                ctx.restore();
            },
            update: function() {
                this.v += CONFIG.gravity; 
                this.y += this.v;
                
                let floorY = canvas.height - 112;
                
                // Collision Floor
                if(this.y >= floorY - this.r) { 
                    this.y = floorY - this.r; 
                    gameOver(); 
                }
                // Ceiling
                if(this.y < this.r) { 
                    this.y = this.r; 
                    this.v = 0; 
                }
            },
            flap: function() { this.v = -CONFIG.jump; }
        };

        const pipes = {
            arr: [], w: 56,
            draw: function() {
                this.arr.forEach(p => {
                    let topH = p.y;
                    let botY = p.y + CONFIG.gap;
                    let botH = canvas.height - 112 - botY;
                    
                    ctx.fillStyle="#73BF2E"; ctx.strokeStyle="#000"; ctx.lineWidth=2;
                    
                    // Gambar pipa hanya jika terlihat di layar (Optimasi)
                    if(p.x < canvas.width && p.x + this.w > 0) {
                        // Top Pipe
                        ctx.fillRect(p.x, 0, this.w, topH); ctx.strokeRect(p.x,-2,this.w,topH+2);
                        ctx.fillRect(p.x-3, topH-26, this.w+6, 26); ctx.strokeRect(p.x-3,topH-26,this.w+6,26);
                        // Bottom Pipe
                        ctx.fillRect(p.x, botY, this.w, botH); ctx.strokeRect(p.x,botY,this.w,botH+2);
                        ctx.fillRect(p.x-3, botY, this.w+6, 26); ctx.strokeRect(p.x-3,botY,this.w+6,26);
                    }
                });
            },
            update: function() {
                if(state.frames % CONFIG.spawnRate === 0) {
                    // Kalkulasi tinggi pipa yang aman agar tidak error di layar pendek
                    let min = 50;
                    let max = canvas.height - 112 - CONFIG.gap - 50;
                    if(max < min) max = min + 10; // Fallback jika layar sangat pendek
                    
                    this.arr.push({ x: canvas.width, y: Math.floor(Math.random()*(max-min)+min), passed: false });
                }

                // Filter pipa yang sudah lewat jauh
                if(this.arr.length > 0 && this.arr[0].x < -60) {
                    this.arr.shift();
                }

                for(let p of this.arr) {
                    p.x -= CONFIG.speed;
                    
                    // COLLISION LOGIC (Improved Hitbox)
                    // Hitbox burung sedikit lebih kecil (margin 4px) agar fair
                    let hitX = bird.x + bird.r - 4;
                    let hitYTop = bird.y - bird.r + 4;
                    let hitYBot = bird.y + bird.r - 4;

                    if(hitX > p.x && bird.x - bird.r + 4 < p.x + this.w) {
                        if(hitYTop < p.y || hitYBot > p.y + CONFIG.gap) {
                            gameOver();
                        }
                    }
                    
                    // Score
                    if(p.x + this.w < bird.x && !p.passed) { 
                        state.score++; 
                        document.getElementById('score').innerText = state.score; 
                        p.passed = true; 
                    }
                }
            }
        };

        const ground = {
            x: 0, h: 112,
            draw: function() {
                let y = canvas.height - this.h;
                ctx.fillStyle="#DED895"; ctx.fillRect(0, y, canvas.width, this.h);
                ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.lineWidth=3; ctx.stroke();
                
                // Grass pattern parallax
                let offset = this.x % 20;
                ctx.fillStyle="#73BF2E"; ctx.fillRect(0,y,canvas.width,15);
                ctx.beginPath(); ctx.moveTo(0,y+15); ctx.lineTo(canvas.width,y+15); ctx.lineWidth=2; ctx.stroke();
                
                // Stripes effect
                ctx.strokeStyle = "rgba(0,0,0,0.1)";
                for(let i=offset; i<canvas.width; i+=20) {
                   ctx.beginPath(); ctx.moveTo(i, y+15); ctx.lineTo(i-10, canvas.height); ctx.stroke();
                }
                ctx.strokeStyle = "#000"; // Reset
            },
            update: function() {
                this.x -= CONFIG.speed; 
            }
        };

        // --- CORE FUNCTIONS ---
        function startGame() {
            showScreen('none'); // Hide all UI
            state.running = true; 
            state.score = 0; 
            state.frames = 0;
            document.getElementById('score').innerText = "0";
            
            // Reset posisi
            bird.y = canvas.height/2; 
            bird.v = 0;
            pipes.arr = [];
            
            state.startTime = Date.now();
            initBg();
            
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            if(!state.running) return; // Mencegah double trigger
            state.running = false;
            
            document.getElementById('final-score').innerText = state.score;
            document.getElementById('score').innerText = "";
            showScreen('gameOver');
            
            saveScore(state.score);
            loadLeaderboard('world');
        }

        // MAIN LOOP DENGAN DELTA TIME FIX
        function gameLoop(timestamp) {
            if(!state.running) return;
            
            requestAnimationFrame(gameLoop);

            // Throttle FPS to ~60
            let delta = timestamp - lastTime;
            if (delta > interval) {
                lastTime = timestamp - (delta % interval);

                ctx.clearRect(0,0,canvas.width,canvas.height);
                
                let cycle = (Math.sin(state.frames/2500)+1)/2; // Day/Night
                drawBg(cycle);

                pipes.update(); pipes.draw();
                ground.update(); ground.draw();
                bird.update(); bird.draw();

                state.frames++;
            }
        }

        function handleInput(e) {
            // Mencegah scroll/zoom browser default
            if(e.cancelable && e.type !== 'mousedown') e.preventDefault();
            
            if(state.running) {
                bird.flap();
            }
        }

        // Event Listeners
        window.addEventListener('keydown', (e) => { if(e.code==='Space') handleInput(e); });
        canvas.addEventListener('touchstart', handleInput, {passive: false});
        canvas.addEventListener('mousedown', handleInput);

        // --- BUTTONS ---
        document.getElementById('btn-login').addEventListener('click', () => {
             if(isOfflineMode) return alert("Fitur tidak tersedia saat offline.");
             signInWithPopup(auth, provider).catch(e => alert(e.message));
        });
        
        document.getElementById('btn-offline').addEventListener('click', () => { 
            showScreen('start');
        });
        
        document.getElementById('btn-logout').addEventListener('click', () => {
            if(auth) signOut(auth).then(()=>window.location.reload());
            else window.location.reload();
        });
        
        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-retry').addEventListener('click', startGame);
        
        document.getElementById('btn-tab-world').addEventListener('click', () => loadLeaderboard('world'));
        document.getElementById('btn-tab-city').addEventListener('click', () => loadLeaderboard('city'));
        document.getElementById('btn-share').addEventListener('click', shareScore);

        // --- DATA & API ---
        async function getLoc() {
            try {
                let req = await fetch('https://ipapi.co/json/');
                let res = await req.json();
                if(res.city) {
                    userLocation = { city: res.city, country: res.country_name };
                    const badge = document.getElementById('location-badge');
                    badge.style.display = 'block';
                    badge.innerText = `📍 ${res.city}`;
                    document.getElementById('start-location').innerText = res.city;
                    document.getElementById('btn-tab-city').innerText = `${res.city.toUpperCase()} 🏘️`;
                }
            } catch(e) { console.log("Loc fail, using default."); }
        }
        getLoc();

        async function saveScore(s) {
            if(!currentUser || !db || isOfflineMode) return;
            // Anti-cheat simple check
            let dur = (Date.now() - state.startTime)/1000;
            if(s > 10 && dur < s*0.5) return; 

            try {
                const ref = doc(db, "scores", currentUser.uid);
                const snap = await getDoc(ref);
                let old = snap.exists() ? snap.data().score : 0;
                
                if(s > old || (snap.exists() && !snap.data().city)) {
                    await setDoc(ref, {
                        name: currentUser.displayName || "Anonymous",
                        photo: currentUser.photoURL,
                        score: Math.max(s, old),
                        timestamp: Date.now(),
                        city: userLocation.city,
                        country: userLocation.country
                    }, { merge: true });
                }
            } catch(e) { console.error("Save failed", e); }
        }

        async function loadLeaderboard(type) {
            if(!db || isOfflineMode) {
                document.getElementById('leaderboard-list').innerHTML = "<div style='text-align:center;padding:10px'>Offline Mode</div>";
                return;
            }
            
            const list = document.getElementById('leaderboard-list');
            const title = document.getElementById('leaderboard-title');
            
            // Toggle UI Buttons
            document.getElementById('btn-tab-world').className = type=='world' ? 'btn btn-small btn-active' : 'btn btn-small';
            document.getElementById('btn-tab-city').className = type=='city' ? 'btn btn-small btn-active' : 'btn btn-small';
            
            list.innerHTML = "Loading...";

            try {
                let q;
                const ref = collection(db, "scores");
                if(type === 'world') {
                    title.innerText = "TOP WORLD 🌍";
                    q = query(ref, orderBy("score", "desc"), limit(10));
                } else {
                    title.innerText = `TOP ${userLocation.city.toUpperCase()} 🏘️`;
                    // Note: Ini butuh Composite Index di Firebase Console agar jalan
                    q = query(ref, where("city", "==", userLocation.city), orderBy("score", "desc"), limit(10));
                }

                const snap = await getDocs(q);
                if(snap.empty) { list.innerHTML = "<div style='text-align:center; padding:10px;'>Belum ada data skor.</div>"; return; }

                let html = ""; let i = 1;
                snap.forEach(d => {
                    let data = d.data();
                    let isMe = currentUser && d.id === currentUser.uid;
                    let safeName = data.name ? data.name.substring(0, 12) : "Anon";
                    let tag = (type==='world' && data.city) ? `<span class="city-tag">📍 ${data.city}</span>` : '';
                    
                    html += `
                        <div class="rank-row ${isMe ? 'rank-me' : ''}">
                            <div style="display:flex;align-items:center;gap:8px;width:75%;">
                                <span style="font-weight:bold; width:20px;">#${i}</span>
                                <div style="display:flex;flex-direction:column;overflow:hidden;">
                                    <span>${safeName}</span>
                                    ${tag}
                                </div>
                            </div>
                            <span style="font-size:0.8rem;">${data.score}</span>
                        </div>`;
                    i++;
                });
                list.innerHTML = html;
            } catch(e) {
                if(e.message.includes("index")) list.innerHTML = "<div style='color:red;font-size:0.6rem'>Admin perlu buat Index di Firebase Console</div>";
                else list.innerHTML = "Gagal memuat data.";
                console.error(e);
            }
        }

        async function shareScore() {
            const data = {
                title: 'Flappy Bird',
                text: `Saya dapat skor ${state.score} di Flappy Bird! Coba kalahkan saya.`,
                url: window.location.href
            };
            if(navigator.share) {
                try { await navigator.share(data); } catch(e){}
            } else {
                window.open(`https://wa.me/?text=${encodeURIComponent(data.text + ' ' + data.url)}`);
            }
        }

        // Start
        resize();
        initBg();
        drawBg(0);
        ground.draw();
        initFirebase(); // Initialize last

    </script>
</body>
</html>
