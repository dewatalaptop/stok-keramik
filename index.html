<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Wing Tap - Ultimate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        body {
            margin: 0; padding: 0;
            height: 100dvh; width: 100vw;
            background-color: #222;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden; touch-action: none; 
            display: flex; justify-content: center; align-items: center;
        }

        #game-stage {
            position: relative;
            width: 100%; max-width: 480px; height: 100%;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            /* Background akan dihandle oleh Canvas */
            background: #333; 
        }

        canvas { 
            display: block; width: 100%; height: 100%; z-index: 1;
            image-rendering: pixelated; 
        }

        /* UI ELEMENTS */
        .ui-layer { position: absolute; width: 100%; pointer-events: none; z-index: 10; text-align: center; }
        
        #score-display {
            top: 10%; font-size: 3rem; color: white;
            -webkit-text-stroke: 2px #000; text-shadow: 4px 4px 0 #000;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(2px);
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            z-index: 20; display: none;
        }

        /* USER PROFILE */
        #user-info {
            position: absolute; top: 10px; left: 10px; z-index: 30;
            display: flex; align-items: center; gap: 10px;
            background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 20px;
            pointer-events: auto; display: none; /* Hidden default */
        }
        #user-avatar { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; }
        #user-name { color: #fff; font-size: 0.6rem; max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* BUTTONS */
        .btn {
            background: #FF6B6B; border: 2px solid #fff;
            box-shadow: 0 4px 0 #c92a2a; color: white;
            padding: 12px 15px; font-size: 0.8rem;
            font-family: inherit; cursor: pointer;
            border-radius: 8px; margin: 8px;
            text-transform: uppercase; width: 80%; max-width: 300px;
            pointer-events: auto; position: relative;
        }
        .btn:active { top: 4px; box-shadow: 0 0 0 #c92a2a; transform: scale(0.98); }
        .btn-google { background: #4285F4; box-shadow: 0 4px 0 #0d47a1; }
        .btn-google:active { box-shadow: 0 0 0 #0d47a1; }
        .btn-green { background: #51CF66; box-shadow: 0 4px 0 #2b8a3e; }

        /* LEADERBOARD */
        #lb-list {
            width: 90%; max-width: 320px; height: 200px; overflow-y: auto;
            background: #fff; border: 4px solid #333; border-radius: 8px;
            padding: 5px; margin-bottom: 15px; pointer-events: auto;
        }
        .lb-row {
            display: flex; justify-content: space-between; padding: 8px;
            border-bottom: 1px dashed #ccc; font-size: 0.6rem; color: #333;
        }
        .lb-row:nth-child(1) { background: #fff3cd; font-weight: bold; }
        
        .loading { color: #fff; font-size: 0.6rem; margin-top: 10px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="game-stage">
        <canvas id="gameCanvas"></canvas>
        <div class="ui-layer" id="score-display">0</div>
        
        <div id="user-info">
            <img id="user-avatar" src="" alt="">
            <span id="user-name">Player</span>
        </div>

        <div id="screen-start" class="screen" style="display: flex;">
            <h1 style="color:#FFD43B; -webkit-text-stroke:2px #000; text-shadow:4px 4px 0 #000; font-size:2.5rem; text-align:center; margin-bottom:20px;">
                WING<br>TAP
            </h1>
            
            <div id="login-section">
                <p style="color:#eee; font-size:0.6rem; margin-bottom:10px; text-align:center;">Login untuk Leaderboard Otomatis</p>
                <button class="btn btn-google" id="btn-login">G Login Google</button>
            </div>
            
            <div id="play-section" style="display:none; text-align:center; width: 100%;">
                <p style="color:#a5d8ff; font-size:0.6rem; margin-bottom:10px;">Halo, <span id="welcome-name">Player</span>!</p>
                <button class="btn btn-green" id="btn-start">MULAI MAIN ▶</button>
                <button class="btn" id="btn-logout" style="background:#555; box-shadow: 0 4px 0 #222; font-size:0.6rem; width:auto;">Logout</button>
            </div>
        </div>

        <div id="screen-over" class="screen">
            <h2 style="color:white; -webkit-text-stroke:2px #000; font-size:1.5rem; margin-bottom:10px;">GAME OVER</h2>
            <div style="background:#FFD43B; border:3px solid #000; padding:10px; border-radius:8px; width:60%; text-align:center; margin-bottom:15px;">
                <div style="font-size:0.6rem; color:#000;">SKOR</div>
                <div id="final-score" style="font-size:2rem; color:#c92a2a;">0</div>
            </div>

            <div id="lb-status" class="loading" style="display:none;">Menyimpan Skor...</div>

            <div id="lb-list">
                <div style="text-align:center; padding:20px; font-size:0.6rem; color:#888;">Memuat Leaderboard...</div>
            </div>
            
            <button class="btn" id="btn-restart">MAIN LAGI ↺</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } 
               from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot } 
               from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // --- KONFIGURASI FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDH6cBMyBCNdzG_tdJNs28AZZIm8HnO8l4", // API KEY ANDA
            authDomain: "flytap-ca3ee.firebaseapp.com",
            projectId: "flytap-ca3ee",
            storageBucket: "flytap-ca3ee.firebasestorage.app",
            messagingSenderId: "690738199480",
            appId: "1:690738199480:web:b1b442690440db79016d4d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        // --- AUTH LOGIC ---
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const loginSec = document.getElementById('login-section');
        const playSec = document.getElementById('play-section');
        const userInfo = document.getElementById('user-info');

        // Cek Status Login
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User Login
                currentUser = user;
                loginSec.style.display = 'none';
                playSec.style.display = 'block';
                userInfo.style.display = 'flex';
                
                document.getElementById('welcome-name').innerText = user.displayName.split(' ')[0];
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-avatar').src = user.photoURL;
                
                // Load Leaderboard Global saat login sukses
                loadLeaderboard();
            } else {
                // User Logout
                currentUser = null;
                loginSec.style.display = 'block';
                playSec.style.display = 'none';
                userInfo.style.display = 'none';
            }
        });

        btnLogin.onclick = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert("Login Gagal: " + error.message);
            }
        };

        btnLogout.onclick = () => signOut(auth);

        // --- LEADERBOARD LOGIC ---
        const lbList = document.getElementById('lb-list');
        const lbStatus = document.getElementById('lb-status');

        function loadLeaderboard() {
            const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(10));
            onSnapshot(q, (snapshot) => {
                lbList.innerHTML = "";
                if(snapshot.empty) {
                    lbList.innerHTML = '<div style="text-align:center; padding:20px; font-size:0.6rem;">Belum ada skor.</div>';
                    return;
                }
                let rank = 1;
                snapshot.forEach((doc) => {
                    const d = doc.data();
                    const isMe = currentUser && d.uid === currentUser.uid;
                    const row = document.createElement('div');
                    row.className = 'lb-row';
                    if(isMe) row.style.background = "#dbe4ff"; // Highlight user sendiri
                    
                    row.innerHTML = `
                        <span style="flex:1">#${rank} ${d.name.substring(0, 15)}</span>
                        <span style="font-weight:bold; color:#E86101;">${d.score}</span>
                    `;
                    lbList.appendChild(row);
                    rank++;
                });
            });
        }

        // Auto Save Score
        window.saveScore = async (score) => {
            if (!currentUser || score === 0) return;
            
            lbStatus.style.display = 'block';
            lbStatus.innerText = "Menyimpan ke Leaderboard...";
            
            try {
                await addDoc(collection(db, "leaderboard"), {
                    name: currentUser.displayName,
                    uid: currentUser.uid,
                    photo: currentUser.photoURL,
                    score: score,
                    timestamp: new Date()
                });
                lbStatus.innerText = "Tersimpan ✅";
                setTimeout(() => lbStatus.style.display = 'none', 2000);
            } catch (e) {
                console.error(e);
                lbStatus.innerText = "Gagal Simpan ❌";
            }
        };
    </script>

    <script>
        // --- GAME ENGINE & ASSETS ---
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

        // CONFIG (Proporsi Flappy Bird Style)
        const CONFIG = {
            gravity: 1200, 
            jump: 350, 
            speed: 160, 
            gap: 130, // Celah pipa sedikit lebih sempit
            pipeWidth: 52 
        };

        // --- ASSETS GENERATOR (Menggambar manual agar tidak perlu load gambar luar) ---
        const assets = { bird: null, pipeTop: null, pipeBot: null, cloud: null, mountain: null };

        function createAssets() {
            // 1. BURUNG (Kecil & Bulat)
            const cB = document.createElement('canvas'); cB.width = 32; cB.height = 24;
            const b = cB.getContext('2d');
            // Badan
            b.fillStyle = "#FFD700"; b.beginPath(); b.ellipse(16,12, 14, 10, 0, 0, Math.PI*2); b.fill(); b.stroke();
            // Mata
            b.fillStyle = "#fff"; b.beginPath(); b.arc(22, 8, 5, 0, Math.PI*2); b.fill(); b.stroke();
            b.fillStyle = "#000"; b.beginPath(); b.arc(24, 8, 2, 0, Math.PI*2); b.fill();
            // Sayap
            b.fillStyle = "#fff"; b.beginPath(); b.ellipse(12, 14, 8, 5, 0, 0, Math.PI*2); b.fill(); b.stroke();
            // Paruh
            b.fillStyle = "#ff6b6b"; b.beginPath(); b.moveTo(24,12); b.lineTo(32,16); b.lineTo(24,20); b.fill(); b.stroke();
            assets.bird = cB;

            // 2. PIPA (Style Mario - Ada Kepala & Gradasi)
            const w = CONFIG.pipeWidth, h = 800;
            const cPT = document.createElement('canvas'); cPT.width = w; cPT.height = h;
            const cPB = document.createElement('canvas'); cPB.width = w; cPB.height = h;
            const pt = cPT.getContext('2d'); const pb = cPB.getContext('2d');

            function drawPipeArt(c, isTop) {
                // Warna dasar gradasi
                let grad = c.createLinearGradient(0,0,w,0);
                grad.addColorStop(0, "#51CF66");
                grad.addColorStop(0.5, "#96F2D7"); // Highlight tengah
                grad.addColorStop(1, "#2F9E44"); // Bayangan pinggir
                
                c.fillStyle = grad;
                c.strokeStyle = "#2b8a3e";
                c.lineWidth = 2;

                // Batang Pipa
                c.fillRect(2, 0, w-4, h);
                c.strokeRect(2, 0, w-4, h);

                // Kepala Pipa
                let capH = 30;
                let capY = isTop ? h - capH : 0;
                
                c.fillStyle = grad;
                c.fillRect(0, capY, w, capH);
                c.strokeRect(0, capY, w, capH);
                
                // Detail kilapan
                c.fillStyle = "rgba(255,255,255,0.3)";
                c.fillRect(6, 0, 4, h); // Kilap batang
                c.fillRect(6, capY, 4, capH); // Kilap kepala
            }
            drawPipeArt(pt, true); drawPipeArt(pb, false);
            assets.pipeTop = cPT; assets.pipeBot = cPB;

            // 3. GUNUNG (Untuk Parallax)
            const cM = document.createElement('canvas'); cM.width = 400; cM.height = 200;
            const m = cM.getContext('2d');
            m.fillStyle = "#868e96"; // Gunung abu
            m.beginPath(); m.moveTo(0,200); m.lineTo(100,50); m.lineTo(200,200); m.fill();
            m.fillStyle = "#adb5bd"; // Gunung kedua
            m.beginPath(); m.moveTo(150,200); m.lineTo(280,80); m.lineTo(400,200); m.fill();
            // Salju di puncak
            m.fillStyle = "#fff";
            m.beginPath(); m.moveTo(100,50); m.lineTo(120,80); m.lineTo(80,80); m.fill();
            assets.mountain = cM;

            // 4. AWAN
            const cC = document.createElement('canvas'); cC.width = 60; cC.height = 40;
            const cl = cC.getContext('2d');
            cl.fillStyle = "rgba(255,255,255,0.8)";
            cl.beginPath(); cl.arc(20,20,15,0,Math.PI*2); cl.arc(40,20,18,0,Math.PI*2); cl.arc(30,10,15,0,Math.PI*2); cl.fill();
            assets.cloud = cC;
        }

        // --- GAME LOGIC ---
        const game = {
            state: 'START', score: 0,
            bird: { y: 0, v: 0, rot: 0 },
            pipes: [],
            bgOffset: 0, // Untuk parallax gunung
            cloudOffset: 0, // Untuk parallax awan
            timeAccum: 0,
            
            // Cycle Logic
            isNight: false,
            
            start: function() {
                resize();
                this.state = 'PLAY';
                this.bird.y = canvas.height / 2; this.bird.v = 0; this.bird.rot = 0;
                this.pipes = []; this.score = 0; this.timeAccum = 0;
                this.isNight = false;
                document.getElementById('score-display').innerText = 0;
                document.getElementById('score-display').style.display = 'block';
                showScreen(null);
            },
            
            over: function() {
                this.state = 'OVER';
                document.getElementById('score-display').style.display = 'none';
                document.getElementById('final-score').innerText = this.score;
                showScreen('screen-over');
                
                // Panggil fungsi simpan skor (global window function dari modul firebase)
                if(window.saveScore) window.saveScore(this.score);
            }
        };

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            if(id) document.getElementById(id).style.display = 'flex';
        }

        let lastTime = performance.now();

        function loop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            if (game.state === 'PLAY') {
                updatePhysics(dt);
            } else if (game.state === 'START') {
                // Animasi idle
                game.bgOffset += (CONFIG.speed * 0.1) * dt; 
                game.cloudOffset += (CONFIG.speed * 0.05) * dt;
                game.bird.y = canvas.height/2 + Math.sin(timestamp/300)*10;
            }

            draw(dt);
            requestAnimationFrame(loop);
        }

        function updatePhysics(dt) {
            // Bird
            game.bird.v += CONFIG.gravity * dt;
            game.bird.y += game.bird.v * dt;
            game.bird.rot = Math.min(Math.PI/4, Math.max(-Math.PI/4, game.bird.v * 0.003));

            // Pipes Spawn
            game.timeAccum += dt;
            if(game.timeAccum > 1.6) { // Jarak antar pipa
                game.timeAccum = 0;
                let min = 100;
                let max = canvas.height - 150 - CONFIG.gap;
                if(max < min) max = min;
                let h = Math.floor(Math.random() * (max - min + 1) + min);
                game.pipes.push({ x: canvas.width, topH: h, passed: false });
            }

            // Movement & Parallax
            let speed = CONFIG.speed;
            game.bgOffset += (speed * 0.2) * dt; // Gunung gerak lambat (20% speed)
            game.cloudOffset += (speed * 0.1) * dt; // Awan gerak sangat lambat (10% speed)

            // Pipe Logic
            const bX = 60; const bR = 10; // Radius hitbox burung diperkecil (10px) agar "Flappy style"
            
            for(let i=0; i<game.pipes.length; i++) {
                let p = game.pipes[i];
                p.x -= speed * dt;

                // Hitbox Check
                // Pipa Width = CONFIG.pipeWidth (52)
                if (bX + bR > p.x && bX - bR < p.x + CONFIG.pipeWidth) {
                    if (game.bird.y - bR < p.topH || game.bird.y + bR > p.topH + CONFIG.gap) game.over();
                }

                // Score
                if (p.x + CONFIG.pipeWidth < bX && !p.passed) {
                    game.score++;
                    document.getElementById('score-display').innerText = game.score;
                    p.passed = true;
                    
                    // Logic Ganti Background tiap 20 poin
                    // 0-19: Siang, 20-39: Malam, 40-59: Siang...
                    game.isNight = Math.floor(game.score / 20) % 2 !== 0;
                }

                if (p.x < -70) { game.pipes.shift(); i--; }
            }

            // Floor & Ceiling
            if(game.bird.y >= canvas.height - 20 || game.bird.y <= 0) game.over();
        }

        function draw(dt) {
            // 1. BACKGROUND (Dynamic Sky)
            // Transisi kasar saja karena diminta "berubah"
            let skyTop = game.isNight ? "#0b1026" : "#4fc3f7";
            let skyBot = game.isNight ? "#2b3252" : "#e1f5fe";
            
            let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, skyTop);
            grad.addColorStop(1, skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0,0, canvas.width, canvas.height);

            // BINTANG (Jika Malam)
            if (game.isNight) {
                ctx.fillStyle = "#FFF";
                for(let i=0; i<20; i++) { // Gambar ulang random tiap frame? Tidak efisien tapi ok untuk retro
                   // Agar stabil, gunakan pseudo-random based on coordinate
                   // Disini kita gambar fix stars saja
                   ctx.fillRect((i*50)%canvas.width, (i*30)%200, 2, 2);
                }
                // Bulan
                ctx.fillStyle = "#ffeb3b";
                ctx.beginPath(); ctx.arc(canvas.width - 50, 50, 20, 0, Math.PI*2); ctx.fill();
            } else {
                // Matahari
                ctx.fillStyle = "#ffeb3b";
                ctx.beginPath(); ctx.arc(canvas.width - 50, 50, 25, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "rgba(255,235,59, 0.3)";
                ctx.beginPath(); ctx.arc(canvas.width - 50, 50, 40, 0, Math.PI*2); ctx.fill();
            }

            // 2. PARALLAX ELEMENTS (Awan & Gunung)
            
            // Awan (Paling Belakang)
            let cOff = game.cloudOffset % canvas.width;
            for(let i = -1; i < 2; i++) {
                ctx.drawImage(assets.cloud, (i * 150) - cOff + 50, 50);
                ctx.drawImage(assets.cloud, (i * 150) - cOff + 200, 100);
            }

            // Gunung (Tengah)
            let mOff = game.bgOffset % 400; // Lebar gunung 400
            let groundY = canvas.height - 50;
            // Gambar gunung berulang
            for(let i = -1; i < Math.ceil(canvas.width/400)+1; i++) {
                ctx.drawImage(assets.mountain, (i * 400) - mOff, groundY - 180); 
            }

            // 3. PIPES
            for(let p of game.pipes) {
                let px = Math.floor(p.x);
                ctx.drawImage(assets.pipeTop, px, p.topH - 800);
                ctx.drawImage(assets.pipeBot, px, p.topH + CONFIG.gap);
            }

            // 4. GROUND
            ctx.fillStyle = game.isNight ? "#1b2618" : "#DED895";
            ctx.fillRect(0, groundY, canvas.width, 50);
            // Garis rumput
            ctx.fillStyle = game.isNight ? "#2b4528" : "#73BF2E"; 
            ctx.fillRect(0, groundY, canvas.width, 10);
            ctx.strokeStyle = "#000"; ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();

            // 5. BIRD
            if (assets.bird) {
                ctx.save();
                ctx.translate(60, game.bird.y);
                ctx.rotate(game.bird.rot);
                ctx.drawImage(assets.bird, -16, -12); // Center drawing
                ctx.restore();
            }
        }

        // --- INPUT HANDLING ---
        function inputAction(e) {
            // Prevent interaction if clicking specific buttons
            if(e.target.closest('button') || e.target.closest('#login-section')) return;
            
            if(game.state === 'START' && currentUser) {
                // Hanya bisa mulai jika sudah login
                game.start();
            } else if(game.state === 'PLAY') {
                game.bird.v = -CONFIG.jump;
            }
        }

        const stage = document.getElementById('game-stage');
        stage.addEventListener('pointerdown', inputAction);
        window.addEventListener('keydown', (e) => {
            if(e.code === 'Space') inputAction(e);
        });

        document.getElementById('btn-start').onclick = () => game.start();
        document.getElementById('btn-restart').onclick = () => {
            game.state = 'START';
            showScreen('screen-start');
        };

        function resize() {
            canvas.width = stage.clientWidth;
            canvas.height = stage.clientHeight;
        }
        window.onresize = resize;
        
        // INIT
        createAssets();
        resize();
        requestAnimationFrame(loop);

    </script>
</body>
</html>
